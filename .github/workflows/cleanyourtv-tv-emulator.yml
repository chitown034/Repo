name: CleanYourTV on an Android TV emulator

on:
  push:
    paths:
      - "cleanyourtv/launcher/**"
      - ".github/workflows/cleanyourtv-tv-emulator.yml"
      - ".github/scripts/tv-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv:
    name: Install and drive the launcher on Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Release APK
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android TV, install, walk Home, Search and Control Center
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/scripts/tv-smoke.sh
      # Small previews of the main screens in the log itself, for reviewers who cannot download artifacts.
      - name: Screenshot previews
        if: always()
        run: |
          for f in 01-home 03-move-settled 07-search-typed 08-search-result-focused 10-control-center 12-type-to-search; do
            [ -f "tv-shots/$f.png" ] || continue
            convert "tv-shots/$f.png" -resize 640x360 -quality 55 "/tmp/$f.jpg"
            echo "PREVIEW $f $(base64 -w0 /tmp/$f.jpg)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-screenshots
          path: tv-shots/
          if-no-files-found: warn
