name: CleanYourTV launcher

on:
  push:
    paths:
      - "cleanyourtv/launcher/**"
      - ".github/workflows/cleanyourtv-launcher.yml"
  pull_request:
    paths:
      - "cleanyourtv/launcher/**"
      - ".github/workflows/cleanyourtv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Unit tests, lint and release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleanyourtv/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Lint report
        if: always()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          [ -f "$f" ] && cat "$f" || find app/build/reports -name 'lint-results*.txt' -exec cat {} \; || true
      - name: The launcher stays small
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 491520 || { echo "APK is over 480 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher-apk
          path: cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
