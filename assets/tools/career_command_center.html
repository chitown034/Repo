<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Command Center</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f1f3f6;--ink:#0b1b33;--ink2:#46536a;--ink3:#76819a;--line:#e1e5ec;--acc:#173563;--acc2:#1d5bbf;--gold:#c9a227;--gold-soft:#faf3dc;--acc-soft:#e7eefb;--ok:#1d7a3e;--ok-soft:#e1f3e7;--warn:#8f6300;--warn-soft:#f8efd2;--crit:#b3261e;--crit-soft:#fbe3e0;--r:14px;--sh:0 1px 2px rgba(11,27,51,.05),0 6px 18px rgba(11,27,51,.07);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#0b1b33;color:#e8edf5;padding:18px 10px}
.brand{padding:0 10px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}.brand b{display:block;font-size:17px}.brand small{color:#9fb0cc;font-size:12px}
.nav button{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:#c8d3e6;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button[aria-current=true]{background:var(--gold);color:#0b1b33;font-weight:650}
.nav .sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7f93b5;padding:12px 10px 4px}
.nav .ct{font-size:11px;opacity:.75}
main{padding:22px 26px 80px;min-width:0}.view{max-width:1180px;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}.vh p{color:var(--ink2);max-width:72ch;margin:4px 0 0}
.eyebrow{font-size:12px;font-weight:650;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.panel>h3{margin-bottom:10px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:550;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc2);color:var(--acc2)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#0b1b33}.btn.sm{padding:4px 9px;font-size:13px}.btn.ghost{border-color:transparent;background:none}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld label,.lbl{font-size:12px;font-weight:600;color:var(--ink3)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical}.grow{flex:1 1 220px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--ink2);white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-acc{background:var(--acc-soft);color:var(--acc)}.p-gold{background:var(--gold-soft);color:#7a5e06}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.job{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;background:var(--panel);padding:12px 14px;cursor:pointer;align-items:center}.job:hover{background:var(--panel2)}
.score{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--acc2)}
.job .t{font-weight:650}.job .e{color:var(--ink2);font-size:13px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}.col h4{font-size:13px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;cursor:pointer}.card:hover{border-color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--panel2);font-size:12px;color:var(--ink2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.callout{border-radius:12px;padding:11px 14px;background:var(--acc-soft);font-size:13.5px}.callout.warn{background:var(--warn-soft)}.callout.gold{background:var(--gold-soft)}
.scrim{position:fixed;inset:0;background:rgba(11,27,51,.45);z-index:40}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.db{padding:16px 20px 40px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:0;background:var(--panel2);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:550;font-size:13px}.tabs button[aria-selected=true]{background:var(--acc);color:#fff}
.comp{display:grid;grid-template-columns:120px minmax(0,1fr) 40px 70px;gap:6px 10px;align-items:center;font-size:13px}
.comp input[type=range]{width:100%}
.out{background:var(--panel2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:60}
.mtab{display:none}
.boards a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);box-shadow:var(--sh)}.boards a:hover{border-color:var(--gold)}.boards a b{font-size:15px}.boards a small{color:var(--ink3)}
.boards a.cj{border:2px solid var(--gold);background:var(--gold-soft)}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.nav{display:flex;overflow-x:auto;gap:4px}.nav .sep{display:none}.nav button{white-space:nowrap;width:auto}.brand{display:none}main{padding:14px}.job{grid-template-columns:52px minmax(0,1fr)}.job .rt{display:none}.comp{grid-template-columns:90px minmax(0,1fr) 34px 54px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><b>Career Command Center</b><small>Free for veterans, spouses &amp; hometown heroes</small></div><nav class="nav" id="nav"></nav></aside><main id="main"></main></div>
<div id="dr"></div><div class="toast" id="toast" hidden></div>
<script>
const K=[["skills","Skills"],["experience","Experience"],["leadership","Leadership"],["domain","Industry fit"],["credentials","Credentials"],["eligibility","Eligibility"],["comp","Pay"],["location","Location"],["seniority","Level"],["company","Company"]];
const DW={skills:15,experience:12,leadership:10,domain:12,credentials:8,eligibility:12,comp:10,location:8,seniority:8,company:5};
const STAGES=[["saved","Saved"],["researching","Researching"],["networking","Networking"],["tailoring","Tailoring"],["ready","Ready to apply"],["applied","Applied"],["screen","Recruiter screen"],["interview","Interview"],["final","Final round"],["offer","Offer"],["accepted","Accepted"],["rejected","Not selected"],["withdrawn","Withdrawn"]];
const SL=Object.fromEntries(STAGES);
const COLS=[["Saved",["saved","researching"]],["Networking",["networking"]],["Tailoring",["tailoring","ready"]],["Applied",["applied"]],["Interviewing",["screen","interview","final"]],["Offer",["offer","accepted"]],["Closed",["rejected","withdrawn"]]];
const ACTIVE=["saved","researching","networking","tailoring","ready","applied","screen","interview","final","offer"];
const CLR=[["","Any / none"],["Public Trust","Public Trust"],["Secret","Secret"],["Top Secret","Top Secret"],["TS/SCI","TS/SCI"],["TS/SCI with Polygraph","TS/SCI with Poly"]];
const FIELDS=[["Cybersecurity","cybersecurity analyst"],["IT support / help desk","IT support specialist"],["Network & systems","network engineer"],["Intelligence analysis","intelligence analyst"],["Logistics & supply chain","logistics specialist"],["Aviation maintenance","aircraft mechanic"],["Electronics technician","electronics technician"],["Skilled trades","maintenance technician"],["Security & law enforcement","security officer"],["Fire & EMS","firefighter EMT"],["Healthcare","medical assistant"],["Training & instruction","military instructor trainer"],["Operations & admin","operations coordinator"],["Communications","communications specialist"],["Data & analytics","data analyst"],["Engineering","systems engineer"]];
const BOARDS=[
 ["ClearanceJobs","Cleared defense and intelligence jobs. Recruiters search cleared profiles.",(q,l,c)=>`https://www.clearancejobs.com/jobs?keywords=${E([q,c].filter(Boolean).join(" "))}&location=${E(l)}`,1],
 ["ClearedJobs.Net","Cleared jobs and cleared job fairs.",(q,l,c)=>`https://clearedjobs.net/jobs?keywords=${E([q,c].filter(Boolean).join(" "))}&location=${E(l)}`,1],
 ["USAJOBS","Federal civilian jobs. Use your veterans' preference.",(q,l)=>`https://www.usajobs.gov/search/results/?k=${E(q)}&l=${E(l)}`],
 ["LinkedIn","Largest professional network and job board.",(q,l)=>`https://www.linkedin.com/jobs/search/?keywords=${E(q)}&location=${E(l)}`],
 ["Indeed","Broad private-sector listings.",(q,l)=>`https://www.indeed.com/jobs?q=${E(q)}&l=${E(l)}`],
 ["CalJOBS","California's job bank and America's Job Centers.",()=>`https://www.caljobs.ca.gov/`],
 ["Hiring Our Heroes","Veteran and spouse hiring events and fellowships.",()=>`https://www.hiringourheroes.org/`],
 ["Hire Heroes USA","Free career coaching and job placement.",()=>`https://www.hireheroesusa.org/`],
 ["MSEP (spouses)","Military Spouse Employment Partnership job board.",()=>`https://msepjobs.militaryonesource.mil/`]];
const QBANK={
 "Opening":["Tell me about yourself.","Why are you leaving the military (or your current job)?","Why this company?","Why this role?","What do you know about our mission and customers?"],
 "Behavioral (use STAR)":["Tell me about a time you led a team through a hard deadline.","Describe a time you disagreed with a leader. What did you do?","Tell me about a mistake you made and what you learned.","Give an example of solving a problem with limited resources.","Describe a time you had to learn something new quickly.","Tell me about a time you improved a process.","Describe a conflict on your team and how you resolved it.","Tell me about a time you handled sensitive information."],
 "Translating military experience":["How does your military experience apply to this job?","Explain your last job without using military terms.","What was the size of your team and budget?","How did you measure success in your role?","What civilian certifications match your training?"],
 "Cleared and government roles":["What clearance do you hold and when was your last investigation?","How do you handle information security in daily work?","Have you worked with government customers or contracting officers?","How do you stay compliant with policy and regulations?"],
 "Closing":["What are your salary expectations?","When can you start?","What questions do you have for us?","Is there anything that would keep you from accepting an offer?"]};
const JARGON=[["NCOIC","Team supervisor"],["OIC","Department manager"],["Division Officer","Department manager"],["Chief","Senior supervisor"],["LPO","Team lead"],["Battalion","Organization of 300 to 1,000 people"],["Company","Organization of 100 to 200 people"],["Platoon","Team of 20 to 50 people"],["Squad","Team of 8 to 12 people"],["Mission","Project or objective"],["Deployment","Overseas assignment"],["TDY","Business travel"],["PCS","Relocation"],["OPORD","Project plan"],["After Action Review","Lessons-learned review"],["SOP","Standard operating procedure"],["Readiness","Operational availability"],["QA","Quality assurance"],["Maintenance control","Maintenance planning and scheduling"],["Supply","Inventory and procurement"],["S1 / Admin","Human resources and administration"],["S2 / Intel","Research and analysis"],["S3 / Ops","Operations planning"],["S4 / Logistics","Logistics and supply chain"],["S6 / Comms","IT and communications"],["Commanding Officer","Chief executive"],["Executive Officer","Chief operating officer"],["Evaluations / FITREPs","Performance reviews"],["Award","Recognition for performance"],["MOS / Rating / AFSC","Job specialty"]];
const VERBS=["Led","Managed","Supervised","Trained","Coordinated","Planned","Improved","Reduced","Increased","Delivered","Directed","Streamlined","Implemented","Analyzed","Maintained","Secured","Resolved","Mentored","Developed","Executed"];
const TPL={
 "LinkedIn connection note":"Hi [Name], I'm a [branch] veteran moving into [field]. I saw you work on [team/role] at [Company] and would value 15 minutes of your advice. Thank you for your service to our community.",
 "Informational interview request":"Subject: Quick question from a veteran exploring [field]\n\nHi [Name],\n\nI recently left the [branch] after [years] years as a [role]. I'm researching careers in [field] and admire the work [Company] does on [mission/product].\n\nWould you have 15 to 20 minutes in the next two weeks for a short call? I'd love to hear how you got started and what skills matter most on your team.\n\nThank you,\n[Your name]\n[Phone] | [LinkedIn]",
 "Referral request":"Hi [Name], thank you again for the advice last week. I just applied for [Job title] ([Req ID]) at [Company]. If you feel comfortable, would you be willing to refer me or pass my resume to the hiring manager? I've attached it here. Either way, I appreciate your help.",
 "Application follow-up":"Subject: Following up on [Job title] application\n\nHello [Name],\n\nI applied for the [Job title] role ([Req ID]) on [date] and wanted to confirm my interest. My experience [one specific match to the job] lines up with what your team needs. I'm happy to share anything else that would help.\n\nThank you,\n[Your name]",
 "Thank-you after interview":"Subject: Thank you, [Job title] interview\n\nHi [Name],\n\nThank you for speaking with me today about the [Job title] role. I enjoyed learning about [specific topic from the interview]. It reinforced my interest, especially [why you fit].\n\nPlease let me know if I can provide anything else.\n\nBest regards,\n[Your name]",
 "Salary negotiation":"Hi [Name],\n\nThank you for the offer for [Job title]. I'm excited about the role. Based on my [years] years of experience, my [clearance/certification], and market data for this position, I was hoping for a base salary of [$X]. Is there flexibility to get closer to that number?\n\nThank you,\n[Your name]"};
const EVENTS=[["Hiring Our Heroes events","https://www.hiringourheroes.org/","Hiring events, fellowships, and spouse programs"],["ClearanceJobs","https://www.clearancejobs.com/","Cleared jobs, recruiters, and career events"],["ClearedJobs.Net job fairs","https://clearedjobs.net/","Cleared job fairs, in person and virtual"],["RecruitMilitary events","https://recruitmilitary.com/","Veteran career fairs nationwide"],["American Corporate Partners","https://www.acp-usa.org/","Free year-long corporate mentorship"],["Hire Heroes USA","https://www.hireheroesusa.org/","Free career coaching and virtual events"]];
const E=s=>encodeURIComponent(s||"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const daysTo=d=>d?Math.round((new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5):null;
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const KEY="ccc.v1";
let D=load();function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.jobs)return v}catch(e){}return{jobs:{},contacts:{},ev:{},tasks:{},offers:{},searches:[],weights:{...DW},prefs:{loc:"",clr:""},log:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Your browser blocked saving. Use Backup to export.")}}
function log(t){D.log.unshift({at:new Date().toISOString(),t});D.log=D.log.slice(0,60);save()}
let V="today",OPEN=null,DT="fit";
const NAV=[["Overview",[["today","Today"]]],["Find",[["search","Job search"],["add","Add a job"]]],["Track",[["tracker","Pipeline"],["tasks","Follow-ups"]]],["Prepare",[["studio","Apply studio"],["network","Referrals"],["company","Company intel"],["interview","Interview lab"],["events","Events"]]],["Decide",[["offers","Offers"],["analytics","Analytics"]]],["Your file",[["vault","Evidence vault"],["backup","Backup & calendar"]]]];
function score(j){const w=D.weights,c=j.c||{};let t=0,s=0;for(const[k]of K){t+=+w[k]||0;s+=(+w[k]||0)*(+c[k]||0)/10}return t?Math.round(s/t*100):0}
function gate(j){const g=j.gate||[];const m=g.filter(x=>x.s==="missing").length,u=g.filter(x=>x.s==="unknown").length;return m?'<span class="pill p-crit">Fails a requirement</span>':u?`<span class="pill p-warn">${u} to confirm</span>`:g.length?'<span class="pill p-ok">Requirements met</span>':""}
function due(){return Object.entries(D.tasks).filter(([,t])=>!t.done&&t.due&&daysTo(t.due)<=2)}
function counts(){const J=Object.values(D.jobs);return{tracker:J.filter(j=>ACTIVE.includes(j.stage)).length,tasks:due().length||"",network:Object.keys(D.contacts).length||"",vault:Object.keys(D.ev).length||"",offers:Object.keys(D.offers).length||""}}
function nav(){const c=counts();$("#nav").innerHTML=NAV.map(([g,it])=>`<div class="sep">${g}</div>`+it.map(([id,l])=>`<button data-v="${id}" aria-current="${V===id}"><span>${l}</span><span class="ct">${c[id]??""}</span></button>`).join("")).join("")}
function go(v){V=v;nav();render();window.scrollTo(0,0)}
function render(){const f={today:vToday,search:vSearch,add:vAdd,tracker:vTracker,tasks:vTasks,studio:vStudio,network:vNetwork,company:vCompany,interview:vInterview,events:vEvents,offers:vOffers,analytics:vAnalytics,vault:vVault,backup:vBackup}[V];$("#main").innerHTML=`<div class="view">${f()}</div>`;after()}
function head(e,t,p,extra){return`<div class="vh"><div><div class="eyebrow">${e}</div><h2>${t}</h2>${p?`<p>${p}</p>`:""}</div>${extra||""}</div>`}
function jobRow(j){const s=score(j);return`<div class="job" data-open="${j.id}"><div><div class="score">${s}</div><div class="meter"><i style="width:${s}%"></i></div></div><div><div class="t">${esc(j.title)}</div><div class="e">${esc(j.employer)}${j.location?" · "+esc(j.location):""}</div><div class="row" style="margin-top:5px"><span class="pill p-acc">${esc(SL[j.stage]||j.stage)}</span>${j.source?`<span class="pill ${/clearance/i.test(j.source)?"p-gold":""}">${esc(j.source)}</span>`:""}${j.clr?`<span class="pill">${esc(j.clr)}</span>`:""}${gate(j)}${j.closing&&daysTo(j.closing)>=0?`<span class="pill ${daysTo(j.closing)<=3?"p-crit":"p-warn"}">Closes ${fmt(j.closing)}</span>`:""}</div></div><div class="rt lbl">${esc(j.pay||"")}</div></div>`}
function nextActions(){const A=[],J=Object.values(D.jobs);
 for(const j of J){const d=daysTo(j.closing);if(d!==null&&d>=0&&d<=7&&!["applied","screen","interview","final","offer","accepted","rejected","withdrawn"].includes(j.stage))A.push([100-d,`Apply before ${fmt(j.closing)}: ${j.title}`,j.employer,j.id])}
 for(const[,t]of due())A.push([90,t.title,`Due ${fmt(t.due)}`,t.job||""]);
 for(const j of J.filter(j=>["saved","researching"].includes(j.stage)).sort((a,b)=>score(b)-score(a)).slice(0,3))A.push([60+score(j)/5,`Tailor your resume for ${j.title}`,`${j.employer}, fit ${score(j)}`,j.id]);
 if(!Object.keys(D.ev).length)A.push([70,"Add 3 accomplishments to your Evidence vault","They power keyword checks and interview answers","vault"]);
 if(!J.length)A.push([80,"Run your first search on ClearanceJobs or USAJOBS","Then add the jobs you like to your pipeline","search"]);
 return A.sort((a,b)=>b[0]-a[0]).slice(0,7)}
function vToday(){const J=Object.values(D.jobs);const st=s=>J.filter(j=>s.includes(j.stage)).length;
 return head("Overview","Your job search, organized","Track every application, tailor every resume, and prepare for every interview. Everything you enter stays private in this browser. Nothing is sent anywhere.",`<div class="row"><button class="btn gold" data-v="search">Search ClearanceJobs</button><button class="btn pri" data-v="add">Add a job</button></div>`)+
 `<div class="kpis"><div class="kpi"><b>${st(ACTIVE)}</b><span>In your pipeline</span></div><div class="kpi"><b>${st(["applied","screen","interview","final","offer","accepted","rejected"])}</b><span>Applications sent</span></div><div class="kpi"><b>${st(["screen","interview","final"])}</b><span>Interviewing</span></div><div class="kpi"><b>${st(["offer","accepted"])}</b><span>Offers</span></div><div class="kpi"><b>${due().length}</b><span>Follow-ups due</span></div><div class="kpi"><b>${Object.keys(D.ev).length}</b><span>Evidence items</span></div></div>

 <div class="callout">Before you accept: get the offer in writing, confirm the start date and any clearance or drug-test contingencies, and ask about relocation, PTO, and GI Bill or tuition benefits. Use the negotiation template in Referrals.</div>`}
function vAnalytics(){const J=Object.values(D.jobs);const steps=[["Tracked",J.length],["Applied",J.filter(j=>(j.hist||[]).some(h=>h.s==="applied")).length],["Interviewed",J.filter(j=>(j.hist||[]).some(h=>["screen","interview","final"].includes(h.s))).length],["Offers",J.filter(j=>(j.hist||[]).some(h=>["offer","accepted"].includes(h.s))).length]];const mx=Math.max(1,steps[0][1]);
 const src={};J.forEach(j=>src[j.source||"Other"]=(src[j.source||"Other"]||0)+1);
 return head("Decide","Analytics","See what's working and adjust how jobs are scored.")+
 `<div class="grid2"><section class="panel"><h3>Funnel</h3>${steps.map(([l,v])=>`<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;margin:6px 0"><span class="lbl">${l}</span><span class="meter" style="height:12px"><i style="width:${v/mx*100}%"></i></span><b>${v}</b></div>`).join("")}<p class="lbl">${steps[1][1]>=5?`Applied to interview: ${Math.round(steps[2][1]/steps[1][1]*100)}%`:"Rates become meaningful after 5 applications."}</p></section>
 <section class="panel"><h3>Where your jobs come from</h3>${Object.entries(src).map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join("")||'<p class="lbl">No data yet.</p>'}</section></div>
 <section class="panel"><h3>Scoring weights</h3><p class="lbl">How much each area counts toward fit scores. Raise what matters most to you.</p><div class="grid3">${K.map(([k,l])=>`<div class="fld"><label>${l}: <b id="wv-${k}">${D.weights[k]}</b></label><input type="range" min="0" max="25" value="${D.weights[k]}" data-w="${k}"></div>`).join("")}</div><button class="btn sm" id="wReset" style="margin-top:8px">Reset weights</button></section>`}
function vVault(){const EV=Object.entries(D.ev);return head("Your file","Evidence vault","Your accomplishments, certifications, and STAR stories in one place. They power the keyword checks and interview prep.")+
 `<section class="panel"><div class="bar"><div class="fld"><label>Type</label><select id="vT">${["Accomplishment","STAR story","Certification","Clearance","Education","Award","Skill"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="fld grow"><label>Title</label><input type="text" id="vN" placeholder="Raised readiness 19 points"></div></div><div class="fld" style="margin-top:8px"><label>Details (numbers, scope, tools, results)</label><textarea id="vD" rows="3"></textarea></div><div class="bar" style="margin-top:8px"><div class="fld grow"><label>Tags (comma separated)</label><input type="text" id="vG" placeholder="leadership, maintenance, quality assurance"></div><button class="btn pri" id="vAdd">Save</button></div></section>
 <div class="grid3">${EV.map(([id,e])=>`<section class="panel"><span class="pill p-acc">${esc(e.type)}</span><h4 style="margin:6px 0">${esc(e.title)}</h4><div style="white-space:pre-wrap;color:var(--ink2);font-size:13.5px">${esc(e.detail)}</div><div class="lbl" style="margin-top:6px">${esc(e.tags||"")}</div><button class="btn sm ghost" data-vdel="${id}">Remove</button></section>`).join("")||'<p class="lbl">Nothing saved yet.</p>'}</div>`}
function vBackup(){return head("Your file","Backup and calendar","Your data lives only in this browser. Export a backup to move it to another device, and add follow-ups to your calendar.")+
 `<div class="grid2"><section class="panel"><h3>Backup</h3><div class="row"><button class="btn pri" id="bkOut">Download backup</button><label class="btn">Restore backup<input type="file" id="bkIn" accept="application/json" hidden></label></div><p class="lbl" style="margin-top:8px">Restoring replaces what is on this device.</p></section>
 <section class="panel"><h3>Calendar</h3><p class="lbl">Download a calendar file with every open follow-up and job closing date. Works with Google, Apple, and Outlook calendars.</p><button class="btn pri" id="icsOut">Download calendar file</button></section>
 <section class="panel"><h3>Start over</h3><p class="lbl">Erase everything stored by this tool on this device.</p><button class="btn" id="wipe" style="color:var(--crit)">Erase my data</button></section></div>`}
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function ics(){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Career Command Center//EN"];const ev=(d,t)=>{const s=d.replace(/-/g,"");L.push("BEGIN:VEVENT","UID:"+uid("c")+"@ccc","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART;VALUE=DATE:"+s,"SUMMARY:"+t.replace(/[,;]/g," "),"END:VEVENT")};
 Object.values(D.tasks).filter(t=>!t.done&&t.due).forEach(t=>ev(t.due,t.title));Object.values(D.jobs).filter(j=>j.closing).forEach(j=>ev(j.closing,"Closes: "+j.title+" at "+j.employer));L.push("END:VCALENDAR");return L.join("\r\n")}
function after(){
 const q=s=>document.querySelector(s),on=(s,f)=>{const e=q(s);if(e)e.onclick=f};
 if(V==="search"){paintBoards();["#sq","#sl","#sc"].forEach(s=>q(s).oninput=paintBoards);q("#sc").onchange=paintBoards;
  document.querySelectorAll("[data-field]").forEach(b=>b.onclick=()=>{q("#sq").value=b.dataset.field;paintBoards()});
  on("#saveSearch",()=>{const p=D.prefs;if(!p.q){toast("Add keywords first");return}D.searches.unshift({q:p.q,loc:p.loc,clr:p.clr});D.searches=D.searches.slice(0,12);save();render()});
  document.querySelectorAll("[data-runs]").forEach(b=>b.onclick=()=>{const s=D.searches[+b.dataset.runs];D.prefs={q:s.q,loc:s.loc,clr:s.clr};save();render()});
  document.querySelectorAll("[data-dels]").forEach(b=>b.onclick=()=>{D.searches.splice(+b.dataset.dels,1);save();render()})}
 if(V==="add")on("#aGo",addJob);
 if(V==="tasks"){on("#tAdd",()=>{const t=q("#tT").value.trim();if(!t)return;D.tasks[uid("t")]={title:t,due:q("#tD").value,done:false};save();nav();render()});document.querySelectorAll("[data-tdone]").forEach(c=>c.onchange=()=>{D.tasks[c.dataset.tdone].done=c.checked;save();nav();render()})}
 if(V==="studio"){const bul=()=>{const v=q("#bV").value,w=q("#bW").value.trim(),r=q("#bR").value.trim(),m=q("#bM").value.trim();q("#bOut").textContent=w?`${v} ${w}${r?", which "+r.replace(/^which /,""):""}${m?" "+m:""}.`:"Your bullet appears here."};["#bV","#bW","#bR","#bM"].forEach(s=>q(s).oninput=bul);
  on("#bCopy",()=>{navigator.clipboard&&navigator.clipboard.writeText(q("#bOut").textContent);toast("Copied")});
  on("#bVault",()=>{const t=q("#bOut").textContent;if(/appears here/.test(t))return;D.ev[uid("e")]={type:"Accomplishment",title:t.slice(0,70),detail:t,tags:""};save();nav();toast("Saved to vault")});
  const tr=()=>{const s=q("#trQ").value.toLowerCase();q("#trB").innerHTML=JARGON.filter(([a,b])=>!s||a.toLowerCase().includes(s)||b.toLowerCase().includes(s)).map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")};q("#trQ").oninput=tr;tr();
  on("#kGo",()=>{const kw=keywords(q("#kJ").value),r=q("#kR").value.toLowerCase();if(!kw.length){toast("Paste a job description");return}const hit=kw.filter(k=>r.includes(k));q("#kOut").innerHTML=`<p style="margin-top:10px"><b>${Math.round(hit.length/kw.length*100)}% coverage.</b> Missing terms are in yellow. Add the ones you can honestly claim.</p><div class="row">${kw.map(k=>`<span class="pill ${hit.includes(k)?"p-ok":"p-warn"}">${esc(k)}</span>`).join("")}</div>`});
  on("#clGo",()=>{const j=D.jobs[q("#clJ").value]||{title:"[Job title]",employer:"[Company]"};const m=q("#clM").value.trim()||"[your strongest match to the job]";q("#clOut").value=`Dear Hiring Manager,\n\nI am applying for the ${j.title} position at ${j.employer}. As a veteran with ${m}, I bring the discipline, leadership, and results your team needs.\n\nIn my most recent role, I [one accomplishment with a number]. I also [second accomplishment tied to a top requirement in the posting].\n\n${j.clr?`I hold an active ${j.clr} clearance. `:""}I would welcome the chance to discuss how I can contribute to ${j.employer}'s mission.\n\nThank you for your time and consideration.\n\nSincerely,\n[Your name]\n[Phone] | [Email] | [LinkedIn]`})}
 if(V==="network"){on("#cAdd",()=>{const n=q("#cN").value.trim();if(!n)return;D.contacts[uid("c")]={n,c:q("#cC").value,r:q("#cR").value,x:q("#cX").value};save();nav();render()});document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{delete D.contacts[b.dataset.cdel];save();nav();render()});document.querySelectorAll("[data-copyprev]").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.previousElementSibling.value);toast("Copied")})}
 if(V==="company"){const r=()=>{vCompany.co=q("#coQ").value.trim();render()};on("#coGo",r);q("#coQ").onkeydown=e=>{if(e.key==="Enter")r()}}
 if(V==="interview"){const pool=()=>{const c=q("#iCat").value;return c?QBANK[c]:Object.values(QBANK).flat()};on("#iNext",()=>{const p=pool();q("#iQ").textContent=p[Math.floor(Math.random()*p.length)]});
  on("#iTimer",()=>{clearInterval(vInterview.h);let s=120;const t=q("#iT");t.textContent="2:00";vInterview.h=setInterval(()=>{s--;if(!document.body.contains(t)){clearInterval(vInterview.h);return}t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0){clearInterval(vInterview.h);t.textContent="Time"}},1000)});
  on("#iSave",()=>{const s=q("#iS").value.trim();if(!s)return;D.ev[uid("e")]={type:"STAR story",title:q("#iQ").textContent.slice(0,70),detail:s,tags:"interview"};save();nav();toast("Story saved")})}
 if(V==="offers"){on("#oAdd",()=>{const n=q("#oN").value.trim();if(!n)return;D.offers[uid("o")]={n,base:q("#oB").value,bonus:q("#oBo").value,benefits:q("#oBe").value,other:q("#oO").value,commute:q("#oC").value,remote:q("#oR").value,spons:q("#oS").value};save();nav();render()});document.querySelectorAll("[data-odel]").forEach(b=>b.onclick=()=>{delete D.offers[b.dataset.odel];save();nav();render()})}
 if(V==="analytics"){document.querySelectorAll("[data-w]").forEach(r=>r.oninput=()=>{D.weights[r.dataset.w]=+r.value;q("#wv-"+r.dataset.w).textContent=r.value;save()});on("#wReset",()=>{D.weights={...DW};save();render()})}
 if(V==="vault"){on("#vAdd",()=>{const t=q("#vN").value.trim();if(!t)return;D.ev[uid("e")]={type:q("#vT").value,title:t,detail:q("#vD").value,tags:q("#vG").value};save();nav();render()});document.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=()=>{delete D.ev[b.dataset.vdel];save();nav();render()})}
 if(V==="backup"){on("#bkOut",()=>dl("career-command-center-backup.json",JSON.stringify(D,null,1),"application/json"));on("#icsOut",()=>dl("job-search-deadlines.ics",ics(),"text/calendar"));on("#wipe",()=>{if(confirm("Erase all job search data on this device?")){try{localStorage.removeItem(KEY)}catch(e){}D=load();nav();render()}});
  const f=q("#bkIn");f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.jobs)throw 0;D=o;save();nav();render();toast("Backup restored")}catch(e){toast("That file isn't a valid backup")}};r.readAsText(f.files[0])}}
}
document.addEventListener("click",e=>{const t=e.target;const v=t.closest("[data-v]");if(v){OPEN=null;$("#dr").innerHTML="";go(v.dataset.v);return}
 const v2=t.closest("[data-v2]");if(v2){if(v2.dataset.co)vCompany.co=v2.dataset.co;OPEN=null;$("#dr").innerHTML="";go(v2.dataset.v2);return}
 const o=t.closest("[data-open]");if(o){OPEN=o.dataset.open;DT="fit";drawer();return}
 if(t.closest("[data-close]")){OPEN=null;drawer();render();return}
 const dt=t.closest("[data-dt]");if(dt){DT=dt.dataset.dt;drawer()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&OPEN){OPEN=null;drawer();render()}});
nav();render();
</script></body></html>
