const fill=(s,f,extra={})=>s.replace(/\{\{(\w+)\}\}/g,(m,k)=>{const v=(extra[k]??f[k]??"").toString();return v||`[${k.replace(/_/g," ").toLowerCase()}]`});
function disputeParagraphs(L,bureauKey,f){
  const to=L.to==="bureau"?BUREAUS[bureauKey]:{name:f.CREDITOR||"[creditor / collector name]",addr:"[dispute address from statement]"};
  const extra={BUREAU:BUREAUS[bureauKey]?.name.split(" ")[0]||""};
  const P=[]; const add=(t,o={})=>P.push({t,...o});
  add(f.NAME||"[Your full name]");add(f.ADDR||"[Street address]");add(f.CITY||"[City, State ZIP]");add(`DOB: ${f.DOB||"[DOB]"}   SSN: XXX-XX-${f.SSN4||"XXXX"}   Phone: ${f.PHONE||"[phone]"}`);add("");
  add(f.DATE);add("");add("SENT VIA CERTIFIED MAIL — RETURN RECEIPT REQUESTED",{b:true});add("");add(to.name);to.addr.split("\n").forEach(l=>add(l));add("");
  add(`RE: ${L.title}${f.CREDITOR?" — "+f.CREDITOR:""}${f.ACCT?" (account ending "+f.ACCT+")":""}`,{b:true});add("");add("To Whom It May Concern:");add("");
  fill(L.body,f,extra).split("\n").forEach(l=>add(l));add("");add("Please send your written response to the address above.");add("");add("Sincerely,");add("");add("");add(f.NAME||"[Signature]");
  if(L.enc?.length){add("");add("Enclosures:",{b:true});L.enc.forEach(e=>add("  • "+e));}
  return P;
}
function loeParagraphs(L,f){
  const P=[]; const add=(t,o={})=>P.push({t,...o});
  add(f.NAME||"[Borrower full name]");add(f.ADDR||"[Street address]");add(f.CITY||"[City, State ZIP]");add(`Phone: ${f.PHONE||"[phone]"}   Email: ${f.EMAIL||"[email]"}`);add("");add(f.DATE);add("");
  add(`To: ${f.LENDER||"Patriot Pacific Financial Corp"} — Underwriting`);add(`Loan number: ${f.LOAN_NO||"[loan number]"}`);add("");
  add(`RE: Letter of Explanation — ${L.title}`,{b:true});add("");add("Dear Underwriter,");add("");
  fill(L.body,f).split("\n").forEach(l=>add(l));add("");
  add("I certify that the statements above are true and correct to the best of my knowledge.");add("");add("Sincerely,");add("");add("");add(`${f.NAME||"[Signature]"}`);add(`SSN: XXX-XX-${f.SSN4||"XXXX"}   Date: ${f.DATE}`);
  if(L.docs?.length){add("");add("Attachments:",{b:true});L.docs.forEach(e=>add("  • "+e));}
  return P;
}

   mount(){const go=()=>{const r=vaEligibility({status:$("#c_status").value,branch:$("#c_status").value,activeDays:val("c_days"),years:val("c_years"),title32Days:val("c_t32"),discharge:$("#c_disch").value,spouse:$("#c_spouse").checked});$("#ck2").innerHTML=`<div class="tag ${r.likely?"good":"warn"}" style="font-size:14px">${r.likely?"Likely eligible — confirm on the COE":"Needs VA review"}</div>${r.checks.map(c=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="${c[1]?"up":"dn"}">${c[1]?"✔":"✘"}</span><span class="sp sm">${esc(c[0])}</span></div>`).join("")}`};$$("#vbody input,#vbody select").forEach(e=>e.oninput=go);go()}},

function barChart(el,items,{w=640,h=220,fmt=v=>money(v),color="var(--acc)",horizontal=false}={}){ // items: [{l,v,c?}]
  const max=Math.max(...items.map(i=>i.v),1);
  if(horizontal){const rh=Math.min(28,(h-10)/items.length);el.setAttribute("viewBox",`0 0 ${w} ${items.length*rh+10}`);el.innerHTML=items.map((it,i)=>`<text x="2" y="${i*rh+rh*0.65}" style="fill:var(--ink)">${esc(it.l)}</text><rect x="170" y="${i*rh+4}" height="${rh-8}" rx="4" fill="${it.c||color}" width="0"><animate attributeName="width" to="${scale(it.v,0,max,0,w-260)}" dur=".7s" fill="freeze"/></rect><text x="${176+scale(it.v,0,max,0,w-260)}" y="${i*rh+rh*0.65}" style="fill:var(--ink);font-weight:600">${fmt(it.v)}</text>`).join("");return}
  const bw=(w-50)/items.length; el.setAttribute("viewBox",`0 0 ${w} ${h}`);
  el.innerHTML=items.map((it,i)=>{const bh=scale(it.v,0,max,0,h-50);return `<rect x="${50+i*bw+bw*0.15}" y="${h-30-bh}" width="${bw*0.7}" height="0" rx="4" fill="${it.c||color}"><animate attributeName="height" from="0" to="${bh}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${h-30}" to="${h-30-bh}" dur=".7s" fill="freeze"/></rect><text x="${50+i*bw+bw/2}" y="${h-32-bh}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(it.v)}</text><text x="${50+i*bw+bw/2}" y="${h-12}" text-anchor="middle">${esc(it.l)}</text>`}).join("");
}
function sparkline(el,vals,{w=200,h=40,color="var(--acc)"}={}){const min=Math.min(...vals),max=Math.max(...vals);el.setAttribute("viewBox",`0 0 ${w} ${h}`);el.innerHTML=`<path d="${path(vals,w,h,{min,max,pl:2,pr:2,pt:4,pb:4})}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${w-2}" cy="${4+scale(vals[vals.length-1],min,max,h-8,0)}" r="3" fill="${color}"/>`}
function donut(el,items,{size=160}={}){const tot=items.reduce((a,i)=>a+i.v,0)||1;let a=0;const r=60,cx=80,cy=80;el.setAttribute("viewBox","0 0 160 160");el.innerHTML=items.map(it=>{const s=a/tot*Math.PI*2;a+=it.v;const e=a/tot*Math.PI*2;const x1=cx+r*Math.cos(s-Math.PI/2),y1=cy+r*Math.sin(s-Math.PI/2),x2=cx+r*Math.cos(e-Math.PI/2),y2=cy+r*Math.sin(e-Math.PI/2);return `<path d="M${x1} ${y1} A${r} ${r} 0 ${e-s>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${it.c}" stroke-width="22"><title>${esc(it.l)}: ${it.v}</title></path>`}).join("")+`<text x="80" y="85" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:18px">${tot}</text>`}
const PAL=["var(--acc)","var(--acc2)","var(--warn)","var(--bad)","#8b5cf6","#0ea5e9","#f97316","#64748b"];

  debt:{html:()=>`<div class="grid g12"><div class="card"><h3>Debt payoff simulator</h3><div id="ddl"></div><button class="btn ghost sm" id="dadd2">+ Add debt</button><div class="form" style="grid-template-columns:1fr 1fr;margin-top:10px">${numf("p_extra","Extra $/month toward debt",400,25)}${numf("p_cr","Consolidation rate %",9.5,.25)}${numf("p_ct","Consolidation term (mo)",60,6)}${numf("p_inc","Gross monthly income $ (for DTI)",7200,100)}${numf("p_house","Proposed housing payment $",2900,50)}</div></div>
   <div><div class="card"><h3>Balance over time by method <span class="sub"><select id="p_sel" style="width:auto;display:inline-block"><option value="all">All methods</option>${DEBT_METHODS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("")}</select></span></h3><svg viewBox="0 0 640 240" id="pch" width="100%"></svg></div><div class="card"><table id="ptbl2"></table><p class="mut sm" style="margin:8px 0 0">"Loan-ready" = first month total debt payments + housing ≤ 43% of income (VA uses residual instead). Consolidation adds a 3% fee; the 0% transfer adds 3% and reverts to the card APR after 18 months. DMP assumes creditors cut APRs to 8%.</p></div></div></div>`,
   mount(){let debts=store.get("pdebts",[{name:"Visa",balance:8400,rate:23.99,payment:210,type:"revolving"},{name:"Store card",balance:2100,rate:27.99,payment:65,type:"revolving"},{name:"Auto loan",balance:14000,rate:7.9,payment:420,type:"installment"},{name:"Personal loan",balance:6000,rate:14.9,payment:180,type:"installment"}]);
     const rows=()=>{$("#ddl").innerHTML=`<table><thead><tr><th>Debt</th><th>Balance</th><th>APR %</th><th>Min pmt</th><th>Type</th><th></th></tr></thead><tbody>${debts.map((d,i)=>`<tr><td><input type="text" data-i="${i}" data-k="name" value="${esc(d.name)}"></td><td><input type="number" data-i="${i}" data-k="balance" value="${d.balance}"></td><td><input type="number" step=".01" data-i="${i}" data-k="rate" value="${d.rate}"></td><td><input type="number" data-i="${i}" data-k="payment" value="${d.payment}"></td><td><select data-i="${i}" data-k="type"><option ${d.type==="revolving"?"selected":""}>revolving</option><option ${d.type==="installment"?"selected":""}>installment</option></select></td><td><button class="btn ghost sm" data-del="${i}">✕</button></td></tr>`).join("")}</tbody></table>`;$$("#ddl input,#ddl select").forEach(e=>e.oninput=()=>{debts[e.dataset.i][e.dataset.k]=e.dataset.k==="name"||e.dataset.k==="type"?e.value:+e.value;store.set("pdebts",debts);go()});$$("#ddl [data-del]").forEach(b=>b.onclick=()=>{debts.splice(b.dataset.del,1);store.set("pdebts",debts);rows();go()})};
     const go=()=>{const D=debts.map(d=>({...d,rate:d.rate/100})),extra=val("p_extra"),inc=val("p_inc"),house=val("p_house");const res=DEBT_METHODS.map((m,k)=>({m,k,r:payoffSim(D,extra,m[0],{consRate:val("p_cr")/100,consTerm:val("p_ct")})}));
       const sel=$("#p_sel").value;const shown=res.filter(x=>sel==="all"||x.m[0]===sel);const L=Math.max(...shown.map(x=>x.r.series.length));lineChart($("#pch"),shown.map(x=>({n:x.m[1].split(" — ")[0],v:x.r.series.concat(Array(L-x.r.series.length).fill(0)),c:PAL[x.k]})),{h:240,fmt:v=>"$"+Math.round(v/1000)+"k",xl:i=>"m"+i});
       const minPay=D.reduce((a,d)=>a+d.payment,0);$("#ptbl2").innerHTML=`<thead><tr><th>Method</th><th>Months to $0</th><th>Interest paid</th><th>Monthly outlay</th><th>DTI now → after</th><th>Loan-ready (43%)</th><th>Payoff order</th></tr></thead><tbody>${res.map(x=>{const dtiNow=(minPay+house)/inc,dtiAfter=house/inc;let ready="now";if(dtiNow>0.43){let m=0,bal=x.r.series;ready="after payoff ("+x.r.months+" mo)";}return `<tr><td><b>${x.m[1]}</b><div class="mut sm">${esc(x.m[2])}</div></td><td>${x.r.months}</td><td>${money(x.r.interest)}</td><td>${money(x.r.payment)}</td><td>${(dtiNow*100).toFixed(0)}% → ${(dtiAfter*100).toFixed(0)}%</td><td>${dtiNow<=0.43?'<span class="tag good">now</span>':ready}</td><td class="sm">${x.r.order.join(" → ")}</td></tr>`}).join("")}</tbody>`};
     rows();$("#dadd2").onclick=()=>{debts.push({name:"New debt",balance:3000,rate:19.99,payment:90,type:"revolving"});store.set("pdebts",debts);rows();go()};$$("[id^=p_]").forEach(e=>e.oninput=go);$("#p_sel").onchange=go;go()}},
  repair:{html:()=>`<div class="grid g12"><div class="card"><h3>Credit repair plan generator</h3><div class="form" style="grid-template-columns:1fr 1fr">${numf("rp_score","Current middle score",store.get("cbase",642),1)}${sel("rp_goal","Goal",[["620","620 — VA/FHA typical overlay"],["640","640 — better VA/FHA pricing"],["660","660 — Non-QM / DSCR"],["680","680 — conventional sweet spot"],["700","700 — jumbo"],["740","740 — best conventional pricing"],["760","760+ — top tier"]],"680")}${numf("rp_budget","Paydown budget $",5000,250)}${sel("rp_issues","Main issues",[["util","High utilization"],["lates","Recent late payments"],["coll","Collections / charge-offs"],["thin","Thin file / no score"],["mixed","Several of the above"]],"mixed")}<div class="wide">${chkf("rp_mil","Active duty / deploying (adds SCRA & active-duty alert steps)")}</div></div><p class="mut sm">Builds a dated plan from today using the Credit Simulator's best actions, the Letter Desk templates and bureau timelines (30-day reinvestigation, 3–5 day rapid rescore). Estimates are heuristic.</p></div>
   <div><div class="card"><h3>Projected score path</h3><svg viewBox="0 0 640 200" id="rpch" width="100%"></svg></div><div class="card" id="rpplan"></div></div></div>`,
   mount(){const go=()=>{const s=val("rp_score"),goal=+$("#rp_goal").value,budget=val("rp_budget"),issue=$("#rp_issues").value,mil=$("#rp_mil").checked;const tl=store.get("ctl",null)||SAMPLE_TRADELINES;const rank=rankActions(s,tl,SAMPLE_INQUIRIES);
     let pts={30:0,60:0,90:0,180:0};const base={util:[18,6,3,2],lates:[0,20,8,6],coll:[0,15,10,8],thin:[4,8,10,14],mixed:[14,16,10,8]}[issue];[30,60,90,180].forEach((d,i)=>pts[d]=base[i]);const cum=[s,s+pts[30],s+pts[30]+pts[60],s+pts[30]+pts[60]+pts[90],s+pts[30]+pts[60]+pts[90]+pts[180]];
     const svg=$("#rpch"),min=Math.min(s,500)-10,max=Math.max(goal,cum[4])+20,y=v=>10+scale(v,min,max,150,0),xs=[60,190,320,450,580];svg.innerHTML=`<line class="axis" x1="60" x2="600" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-dasharray="5 4"/><text x="2" y="${y(goal)+4}" style="fill:var(--good)">goal ${goal}</text><path class="draw" d="${cum.map((v,i)=>(i?"L":"M")+xs[i]+" "+y(v)).join(" ")}" fill="none" stroke="var(--acc)" stroke-width="3"/>${cum.map((v,i)=>`<circle cx="${xs[i]}" cy="${y(v)}" r="5" fill="${v>=goal?"var(--good)":"var(--acc)"}"/><text x="${xs[i]}" y="${y(v)-10}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${v}</text><text x="${xs[i]}" y="190" text-anchor="middle">${["today","day 30","day 60","day 90","day 180"][i]}</text>`).join("")}`;drawIn(svg);
     const hit=cum.findIndex(v=>v>=goal);const today=new Date();const dt=d=>new Date(today.getTime()+d*864e5).toLocaleDateString("en-US",{month:"short",day:"numeric"});
     $("#rpplan").innerHTML=`<h3>Plan <span class="sub">${hit>=0?"goal reached around "+["today","day 30","day 60","day 90","day 180"][hit]:"goal likely needs more than 180 days — re-run after phase 3"}</span></h3>${REPAIR_PHASES.map(p=>`<details open><summary>${dt(p.day)} — ${esc(p.t)}</summary><ul class="sm" style="margin:6px 0 0 18px">${p.items.map(x=>`<li>${esc(x)}</li>`).join("")}${p.day===1?rank.filter(x=>/pay/.test(x.def.id)&&x.cost<=budget).slice(0,3).map(x=>`<li><b>From your simulator:</b> ${esc(x.t.creditor)} — ${esc(x.def.label)} (+${x.delta}, ${money(x.cost)})</li>`).join(""):""}${p.day===1&&mil?`<li><b>Military:</b> place an active-duty alert (D23); send SCRA notice with orders to every pre-service creditor (D27); enroll in free Military Credit Monitoring.</li>`:""}${p.day===7?rank.filter(x=>/fixlate|delete|pfd/.test(x.def.id)).slice(0,3).map(x=>`<li><b>Letter Desk:</b> ${esc(x.t.creditor)} — ${esc(x.def.label)} (+${x.delta})</li>`).join(""):""}</ul></details>`).join("")}<div class="row" style="margin-top:8px"><button class="btn sm" id="rpcopy">Copy plan</button><a class="btn ghost sm" href="#letters">Open Letter Desk</a><a class="btn ghost sm" href="#credit">Open Credit Simulator</a></div>`;
     $("#rpcopy").onclick=()=>copy(REPAIR_PHASES.map(p=>`${dt(p.day)} — ${p.t}\n`+p.items.map(x=>"  • "+x).join("\n")).join("\n\n"))};$$("#wbody input,#wbody select").forEach(e=>e.oninput=go);go()}},
 };
  const tabs=$$("#wtabs button");const show=k=>{store.set("wtab",k);tabs.forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#wbody").innerHTML=T[k].html();T[k].mount()};tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));show(store.get("wtab","strat")); }};

/* ======== SCALE ENGINE ======== */
PAGE.scale={ html:()=>`<div class="tabs" id="stabs">${[["cap","1,000-loan capacity model"],["stages","AI automation by loan stage"],["agents","AI agents to scale"],["service","5-star service & loyalty"]].map(([k,t])=>`<button data-t="${k}">${t}</button>`).join("")}</div><div id="sbody" style="margin-top:14px"></div>`,
 mount(){ const T={
  cap:{html:()=>`<div class="card"><h3>Capacity model <span class="sub">what 1,000 closings a year actually requires</span></h3><div class="form" style="grid-template-columns:repeat(6,1fr)">${numf("s_target","Closings / year",1000,50)}${sel("s_preset","Scenario",[["conservative","Conservative"],["base","Base"],["aggressive","Aggressive"]],"base")}${numf("s_cpl","Cost per lead $",38,1)}${numf("s_tech","Tech stack $/mo",6500,250)}${numf("s_re","RE sides share %",30,5)}${numf("s_bps","Comp (bps)",120,5)}</div></div>
   <div class="grid g6" id="sk"></div><div class="grid g21"><div class="card"><h3>24-month ramp to run-rate <span class="sub">closings per month</span></h3><svg viewBox="0 0 640 220" id="sramp" width="100%"></svg></div><div class="card"><h3>Team required</h3><table id="sstaff"></table></div></div>
   <div class="grid g2"><div class="card"><h3>Monthly P&L at run-rate</h3><svg id="spl" width="100%"></svg></div><div class="card"><h3>Operating rhythm at this scale</h3><ul class="sm" style="margin:0 0 0 18px"><li>Daily: 9:00 pipeline stand-up (15 min) — every file has an owner and a next date</li><li>Daily: speed-to-lead report (5-min SLA %) and missing-doc chase list</li><li>Weekly: Friday 3pm status blast; Monday capacity audit (Layer 1 time ≥ 80%)</li><li>Monthly: pull-through, cycle time, cost per loan, NPS, review count; retune lead spend</li><li>Quarterly: lender scorecard (turn times, exceptions), program_rules re-verify, team ratios</li></ul></div></div>`,
   mount(){const go=()=>{const p={...SCALE_PRESETS[$("#s_preset").value],compBps:val("s_bps")};const c=capacity(val("s_target"),p,{cpl:val("s_cpl"),tech:val("s_tech"),reSideShare:val("s_re")/100});
     $("#sk").innerHTML=[["Closings / month",c.perMonth.toFixed(0)],["Per business day",c.perDay.toFixed(1)],["Applications / month",c.apps.toFixed(0)],["Leads / month",c.leads.toFixed(0)],["Leads / day",c.leadsDay.toFixed(0)],["Annual revenue",money(c.revenue)]].map(([k,v])=>`<div class="card kpi"><div class="k">${k}</div><div class="v" style="font-size:20px">${v}</div></div>`).join("");
     lineChart($("#sramp"),[{n:"Closings/mo",v:c.ramp,c:"var(--acc)"}],{h:220,fmt:v=>Math.round(v),xl:i=>"m"+(i+1)});
     $("#sstaff").innerHTML=`<thead><tr><th>Role</th><th>FTE</th><th>$/mo</th></tr></thead><tbody>${c.staff.map(s=>`<tr><td>${esc(s.role)}</td><td>${s.n}</td><td>${money(s.cost)}</td></tr>`).join("")}<tr><td><b>Total payroll</b></td><td>${c.staff.reduce((a,s)=>a+s.n,0)}</td><td><b>${money(c.payroll)}</b></td></tr></tbody>`;
     barChart($("#spl"),[{l:"Revenue",v:c.revMonth,c:"var(--good)"},{l:"Payroll",v:c.payroll,c:"var(--warn)"},{l:"Marketing",v:c.marketing,c:"var(--warn)"},{l:"Tech",v:c.tech,c:"var(--warn)"},{l:"Net",v:Math.max(0,c.netMonth),c:"var(--acc)"}],{fmt:v=>"$"+Math.round(v/1000)+"k"});
     $("#spl").insertAdjacentHTML("afterend",``);};$$("#sbody input,#sbody select").forEach(e=>e.oninput=go);go()}},
  stages:{html:()=>`<div class="card"><h3>Loan process — AI, automations and the human gate at every stage</h3><div class="row"><select id="st_sel" style="width:auto"><option value="">All stages</option>${LOAN_STAGES.map(s=>`<option>${s.s}</option>`).join("")}</select></div></div><div id="stlist"></div>`,
   mount(){const d=()=>{const f=$("#st_sel").value;$("#stlist").innerHTML=LOAN_STAGES.filter(s=>!f||s.s===f).map((s,i)=>`<div class="card"><h3>${i+1}. ${esc(s.s)} <span class="sub">SLA: ${esc(s.sla)}</span></h3><div class="grid g3" style="margin-top:0"><div><b class="sm">AI agents</b><ul class="sm" style="margin:4px 0 0 18px">${s.ai.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><b class="sm">Automations</b><div class="steps">${s.auto.map(x=>`<span class="step">${esc(x)}</span>`).join("")}</div></div><div><b class="sm">Human gate</b><div class="tag warn" style="white-space:normal;display:block;margin-top:4px">${esc(s.human)}</div></div></div></div>`).join("")};$("#st_sel").onchange=d;d()}},
  agents:{html:()=>`<div class="card"><h3>AI agents that let one producer close 1,000 loans</h3><table><thead><tr><th>Agent</th><th>What it does</th><th>Stack</th><th>Guardrail</th></tr></thead><tbody>${AI_AGENTS_SCALE.map(a=>`<tr><td><b>${esc(a[0])}</b></td><td class="sm">${esc(a[1])}</td><td class="sm mono">${esc(a[2])}</td><td class="sm"><span class="tag warn" style="white-space:normal">${esc(a[3])}</span></td></tr>`).join("")}</tbody></table><p class="mut sm">Every agent produces a draft or a tool; a human approves anything consumer-facing (Layer 3 rule). Build order: receptionist → doc/income AI → condition agent → status bot → compliance QC → annual review.</p></div>`,mount(){}},
  service:{html:()=>`<div class="grid g21"><div class="card"><h3>The 5-star promise</h3><ol class="sm" style="margin:0 0 0 18px">${SERVICE.promise.map(p=>`<li>${esc(p)}</li>`).join("")}</ol><h3 style="margin-top:12px">Client journey — every touch scheduled</h3><table><thead><tr><th>When</th><th>Touch</th><th>Owner</th></tr></thead><tbody>${SERVICE.journey.map(j=>`<tr><td><b>${esc(j[0])}</b></td><td class="sm">${esc(j[1])}</td><td><span class="tag">${esc(j[2])}</span></td></tr>`).join("")}</tbody></table></div>
   <div><div class="card"><h3>Service KPIs <span class="sub">now → target</span></h3>${SERVICE.kpis.map(k=>`<div style="padding:6px 0"><div class="row sm"><span class="sp">${esc(k[0])}</span><b>${k[1]}</b><span class="mut">→ ${k[2]}</span></div><div class="bar"><i style="width:${Math.min(100,k[1]/k[2]*100)}%"></i></div></div>`).join("")}</div><div class="card"><h3>Loyalty tiers</h3>${SERVICE.tiers.map(t=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(t[0])}</b> <span class="mut sm">${esc(t[1])}</span><div class="sm">${esc(t[2])}</div></div>`).join("")}<p class="mut sm">Rewards are for service and reviews — never a thing of value for loan referrals (RESPA §8).</p></div><div class="card"><h3>Service recovery triggers</h3><ul class="sm" style="margin:0 0 0 18px">${SERVICE.recovery.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div></div></div>`,mount(){}},
 };
  const tabs=$$("#stabs button");const show=k=>{store.set("stab",k);tabs.forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#sbody").innerHTML=T[k].html();T[k].mount()};tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));show(store.get("stab","cap")); }};

boot();

</script>
