<title>VANESSA Command Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--ink:#14181f;--mut:#5b6573;--line:#dfe3e9;--acc:#1e5eff;--acc2:#0b8a6f;--warn:#b86e00;--bad:#c62d3a;--good:#12805c;--chip:#e8eefc;--shadow:0 1px 2px rgba(20,24,31,.06),0 6px 20px rgba(20,24,31,.05)}
:root[data-theme=dark]{--bg:#0d1117;--panel:#151b24;--panel2:#1b2330;--ink:#e8edf4;--mut:#93a0b3;--line:#263042;--acc:#5b8cff;--acc2:#3ccf9e;--warn:#e8a33d;--bad:#ff6b76;--good:#3ccf9e;--chip:#1e2a45;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1117;--panel:#151b24;--panel2:#1b2330;--ink:#e8edf4;--mut:#93a0b3;--line:#263042;--acc:#5b8cff;--acc2:#3ccf9e;--warn:#e8a33d;--bad:#ff6b76;--good:#3ccf9e;--chip:#1e2a45;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:232px 1fr;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 14px;font-weight:700;letter-spacing:.02em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-weight:800}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px}
nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mut);text-align:left}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button.on{background:var(--chip);color:var(--acc);font-weight:600}
nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:14px 10px 4px}
nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
main{padding:0 22px 40px;min-width:0}
header.top{display:flex;gap:12px;align-items:center;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:19px;margin:0;flex:1;min-width:180px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,128,92,.5)}70%{box-shadow:0 0 0 8px rgba(18,128,92,0)}100%{box-shadow:0 0 0 0 rgba(18,128,92,0)}}
.ticker{display:flex;gap:16px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut)}
.ticker b{color:var(--ink)}.up{color:var(--good)}.dn{color:var(--bad)}
.grid{display:grid;gap:14px;margin-top:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .sub{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .k{color:var(--mut);font-size:12px}.kpi .d{font-size:12px;color:var(--good)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--chip);color:var(--acc);margin:0 4px 4px 0}
.tag.good{background:rgba(18,128,92,.14);color:var(--good)}.tag.bad{background:rgba(198,45,58,.14);color:var(--bad)}.tag.warn{background:rgba(184,110,0,.16);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.sm{padding:3px 9px;font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input[type=number],input[type=text],input[type=password],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=range]{width:100%;accent-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}.tabs button{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--mut)}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace}
.kan{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow:auto}
.col{background:var(--panel2);border-radius:10px;padding:8px;min-height:180px}.col h4{margin:2px 4px 8px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}.lead:active{cursor:grabbing}.col.over{outline:2px dashed var(--acc)}
pre.code{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font:12.5px/1.55 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;margin:8px 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);animation:rise .25s both;z-index:50;max-width:360px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);margin-bottom:8px}summary{cursor:pointer;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.step{padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;transition:all .3s}.step.run{background:var(--chip);border-color:var(--acc);color:var(--acc)}.step.done{background:rgba(18,128,92,.15);border-color:var(--good);color:var(--good)}
.sig{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);animation:rise .45s both}
.sw{position:relative;width:46px;height:24px;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:background .2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--good)}.sw.on::after{transform:translateX(22px)}
svg text{fill:var(--mut);font-size:11px}.axis{stroke:var(--line)}
.rec{border-left:4px solid var(--acc);padding-left:12px;margin:10px 0;animation:rise .4s both}.rec h4{margin:0 0 4px;display:flex;gap:10px;align-items:center}.score{font-size:12px;background:var(--chip);color:var(--acc);padding:1px 9px;border-radius:99px}
.hide{display:none!important}
@media(max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21,.g12{grid-template-columns:1fr 1fr}}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside .brand,nav .sec{display:none}nav{display:flex}nav button{white-space:nowrap;width:auto}main{padding:0 14px 30px}.g2,.g3,.g4,.g6,.g21,.g12{grid-template-columns:1fr}.kan{grid-template-columns:repeat(6,220px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* artifact contract: safe-area gutters + sticky header inset */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
aside{padding-left:max(10px,env(safe-area-inset-left,0px))}
header.top{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{min-height:100%}

</style>

<aside><div class="brand"><div class="logo">V</div><div>VANESSA 3.0<small>Realtor · Mortgage · Credit OS</small></div></div><nav id="nav"></nav></aside>

<script>

<script>
/* Pure calculators (mirror supabase/001_calculators_and_home_report.sql) + loan recommendation engine. */
const pmt=(P,r,n)=>n<=0?0:r===0?P/n:P*(r/12)/(1-Math.pow(1+r/12,-n));
const balAfter=(P,r,n,k)=>r===0?P-P/n*k:P*Math.pow(1+r/12,k)-pmt(P,r,n)*(Math.pow(1+r/12,k)-1)/(r/12);

function buyVsRent(i){
  const loan=i.price*(1-i.downPct), down=i.price*i.downPct, closing=i.price*i.closingPct, pi=pmt(loan,i.rate,i.termYears*12);
  let home=i.price, rent=i.rent, bal=loan, port=down+closing, mr=Math.pow(1+i.invest,1/12)-1, be=null, rows=[], bnw=0, rnw=0, own=0;
  for(let y=1;y<=i.horizon;y++){
    let intY=0,prinY=0;
    for(let m=0;m<12;m++){
      const mi=bal*i.rate/12; intY+=mi; prinY+=pi-mi; bal-=pi-mi;
      const tax=home*i.taxRate/12, maint=i.price*i.maintPct/12, ins=i.insurance/12;
      const ben=i.itemize?(mi+tax)*i.marginal:0;
      own=pi+tax+ins+i.hoa+maint-ben;
      port=port*(1+mr)+(own-(rent+i.rentersIns/12));
    }
    home*=1+i.appreciation; rent*=1+i.rentGrowth;
    bnw=home*(1-i.sellPct)-bal; rnw=port;
    if(be===null&&bnw>=rnw) be=y;
    rows.push({year:y,home,bal,buyer:bnw,renter:rnw,own,rent:rent/(1+i.rentGrowth),intY,prinY});
  }
  return {loan,down,closing,pi,breakeven:be,winner:bnw>=rnw?"buy":"rent",adv:Math.abs(bnw-rnw),rows};
}

function debtConsolidation(i){
  let tb=0,tp=0,wr=0,ci=0,warn=[];
  i.debts.forEach(d=>{
    tb+=d.balance;tp+=d.payment;wr+=d.balance*d.rate;
    let mo;
    if(d.rate>0&&d.payment>d.balance*d.rate/12) mo=-Math.log(1-(d.rate/12*d.balance)/d.payment)/Math.log(1+d.rate/12);
    else{mo=d.rate===0?d.balance/Math.max(d.payment,1):600; warn.push(`Payment on "${d.name||"debt"}" barely covers interest.`);}
    ci+=Math.max(d.payment*mo-d.balance,0);
  });
  if(!tb) return {error:"Add at least one debt."};
  wr/=tb;
  const closing=tb*i.closingPct, cash=i.mode==="cashout_refi";
  const newAmt=cash?i.firstBal+tb+closing:tb+closing, newPay=pmt(newAmt,i.newRate,i.newTerm*12);
  const save=cash?(i.firstPay+tp)-newPay:tp-newPay, newInt=newPay*i.newTerm*12-newAmt;
  const be=save>0?closing/save:null, cltv=i.homeValue>0?(i.firstBal+tb+closing)/i.homeValue:null;
  // longest current payoff for the "longer term" warning
  const maxCur=Math.max(...i.debts.map(d=>d.rate>0&&d.payment>d.balance*d.rate/12?-Math.log(1-(d.rate/12*d.balance)/d.payment)/Math.log(1+d.rate/12):600));
  if(cltv!==null&&cltv>i.maxCltv) warn.push(`CLTV ${(cltv*100).toFixed(1)}% exceeds the ${Math.round(i.maxCltv*100)}% cap — reduce the debts rolled in.`);
  if(i.newTerm*12>maxCur*1.5) warn.push("Longer term lowers the payment but can raise total interest — check lifetime cost.");
  if(cash&&i.firstRate>0&&i.newRate>i.firstRate) warn.push(`Cash-out refi replaces a ${(i.firstRate*100).toFixed(3)}% first mortgage with ${(i.newRate*100).toFixed(3)}% — consider a HELOC/HELOAN instead.`);
  warn.push("Unsecured debt becomes debt secured by the home — missed payments risk foreclosure.");
  return {tb,tp,wr,closing,newAmt,newPay,save,be,ci,newInt,delta:ci-newInt,cltv,warn};
}

function armVsFixed(i){
  const n=i.term*12, fp=pmt(i.loan,i.fixedRate,n), ap=pmt(i.loan,i.armRate,n), fix=i.fixedYrs||5;
  let bal=i.loan,rate=i.armRate,pay=ap,bf=i.loan,pa=0,pf=0,rows=[];
  for(let m=1;m<=Math.min(n,i.horizon*12);m++){
    if(m>fix*12&&((m-1-fix*12)%12===0)){
      const target=i.index+i.margin;
      let r=m===fix*12+1?Math.min(target,i.armRate+i.capInit):Math.min(Math.max(target,rate-i.capPer),rate+i.capPer);
      rate=Math.min(r,i.armRate+i.capLife); pay=pmt(bal,rate,n-m+1);
    }
    bal+=bal*rate/12-pay; bf+=bf*i.fixedRate/12-fp; pa+=pay; pf+=fp;
    if(m%12===0) rows.push({year:m/12,rate,pay,fp,sav:pf-pa,bal,bf});
  }
  const worstRate=i.armRate+i.capLife, worstPay=pmt(balAfter(i.loan,i.armRate,n,fix*12),worstRate,n-fix*12);
  return {fp,ap,saveInit:fp-ap,fully:i.index+i.margin,balReset:balAfter(i.loan,i.armRate,n,fix*12),worstRate,worstPay,shock:worstPay-ap,rows};
}

/* Temporary buydown: subsidy = Σ(payment at note rate − payment at bought-down rate) × 12 */
function buydown(loan,note,type,term){
  const steps={"3-2-1":[3,2,1],"2-1":[2,1],"1-0":[1],"1-1":[1]}[type]; const base=pmt(loan,note/100,term*12);
  const yrs=steps.map((d,k)=>{const p=pmt(loan,(note-d)/100,term*12);return{year:k+1,rate:note-d,pay:p,save:base-p};});
  const cost=yrs.reduce((s,y)=>s+y.save*12,0);
  return {base,yrs,cost,pct:cost/loan*100};
}

/* ---------------- Loan recommendation engine ---------------- */
const FICO_MID={"<580":560,"580-619":600,"620-659":640,"660-679":670,"680-719":700,"720-759":740,"760+":780};
const fmt$=n=>"$"+Math.round(n).toLocaleString();

function recommend(s){
  const fico=FICO_MID[s.fico], loan=s.price*(1-s.downPct/100), ltv=100-s.downPct;
  const limit=s.area==="sandiego"?LIMITS.sandiego:s.area==="high"?LIMITS.ceiling:LIMITS.baseline;
  const isJumbo=loan>limit, out=[], notes=[];
  const add=(id,score,why,warn)=>{ const p=PROGRAMS.find(p=>p.id===id); out.push({p,score:Math.max(1,Math.min(99,Math.round(score))),why,warn:warn||[]}); };
  const primary=s.occ==="primary", inv=s.occ==="investment", w2=s.income==="w2";
  const docIssue=["asset","foreign"].includes(s.income);
  const selfDoc=["selfemp","1099"].includes(s.income); // agency paths need 2 yrs of returns

  // ---- VA
  if(s.vet&&!inv&&s.property!=="mfg"){
    let sc=88+(s.downPct===0?4:0)-(fico<620?8:0)-(s.dti>50?10:0); const why=["Veteran/active-duty eligibility → $0 down, no monthly MI at any credit tier"], warn=[];
    if(s.wantCredit) why.push("Seller can pay unlimited true closing costs + 4% concessions");
    if(isJumbo) {why.push(`Loan ${fmt$(loan)} exceeds the ${fmt$(limit)} area limit — Jumbo VA (to ~$3M, up to 89.99% LTV) avoids conventional jumbo MI`); sc-=3;}
    if(fico<620) warn.push("Most lenders overlay a 620 floor; Loan United / Mortgage Solutions can manual-underwrite lower");
    if(s.dti>50) warn.push("Residual income must support DTI >50% — run the residual table");
    if(w2||s.income==="retired") add("va",sc,why,warn); else add("va",sc-12,why.concat("Self-employed/1099 files need 2-yr documentation"),warn);
  }
  // ---- FHA
  if(!inv&&s.property!=="mfg-land"){
    let sc=60; const why=[],warn=[];
    if(fico>=580&&s.downPct>=3.5){why.push("3.5% down available at 580+"); sc+=14;} else if(fico<580&&s.downPct>=10){why.push("500–579 allowed with 10% down"); sc+=8;} else {warn.push("Down payment below FHA minimum for this score"); sc-=40;}
    if(fico<660){sc+=14; why.push("FHA often prices best below ~680");} else sc-=8;
    if(s.dti>45) {why.push("Compensating-factor DTI up to ~50–56.9%"); sc+=6;}
    if(s.bk){why.push("Shorter post-BK/FC waits than conventional (verify seasoning)"); sc+=8;}
    if(s.wantCredit) why.push("Seller can pay up to 6% of costs/prepaids");
    if(s.property==="multi"&&primary) {why.push("House-hack: 2–4 units with rental income counted"); sc+=6;}
    if(selfDoc){sc-=6;warn.push("Self-employed: needs 2 years of tax returns (net income after write-offs) — compare Bank Statement");}
    if(isJumbo||loan>LIMITS.fhaCeiling) {warn.push("Above the FHA area limit"); sc-=70;}
    if(!docIssue&&sc>5) add("fha",sc,why,warn);
  }
  // ---- Conventional
  if(!inv||s.property==="multi"){
    if(!isJumbo&&!docIssue){
      let sc=55; const why=[],warn=[];
      if(fico>=720){sc+=26;why.push("720+ credit earns best LLPA/MI pricing");} else if(fico>=680){sc+=18;why.push("680+ credit — usually lowest all-in cost");} else if(fico>=620){sc+=4;warn.push("Sub-680: PMI and LLPAs can make FHA cheaper — compare");} else sc-=45;
      if(s.downPct>=20){sc+=10;why.push("20% down → no PMI");} else if(s.downPct>=5){sc+=2;why.push("PMI auto-terminates at 78%");} else if(s.downPct>=3){why.push("3% down via HomeReady/Home Possible/FTHB");} else sc-=45;
      if(s.dti>45) {sc-=10;warn.push("DTI above 45% needs strong compensating factors");}
      if(s.wantCredit) why.push(s.downPct>=25?"Up to 9% seller credit at ≤75% LTV":s.downPct>=10?"Up to 6% seller credit (75.01–90% LTV)":"Up to 3% seller credit (>90% LTV)");
      if(selfDoc){sc-=6;warn.push("Self-employed: 2 years of returns; income = net after write-offs. 1-yr exception may apply");}
      if(s.bk) {sc-=20;warn.push("Longer BK/FC waiting periods than FHA/VA");}
      add("conv",sc,why,warn);
    }
  }
  // ---- USDA
  if(!inv&&primary&&s.property==="rural"&&s.downPct===0&&fico>=580){
    let sc=70+(fico>=640?10:-5); add("usda",sc,["Rural-eligible property + $0 down","1% guarantee fee (financeable) + 0.35% annual","Income must be under the local 2026 cap (~$122,800 for 1–4 in most counties)"],fico<640?["Manual underwrite path for 580–639"]:[]);
  }
  // ---- Jumbo
  if(isJumbo&&!inv&&!docIssue&&!(s.vet&&primary)){ /* jumbo VA handled in VA block */
    let sc=60+(fico>=740?18:fico>=720?12:fico>=700?4:-30)+(s.downPct>=20?10:s.downPct>=10?0:-25)-(s.dti>43?12:0);
    add("jumbo",sc,[`Loan ${fmt$(loan)} is above the ${fmt$(limit)} area limit`,"Expect 6–12 months PITI reserves"],s.downPct<20?["20%+ down usually required above $1.5M"]:[]);
  }
  // ---- Non-QM paths
  if(inv){
    add("dscr",78+(fico>=700?8:fico>=660?0:-14)+(s.downPct>=25?6:s.downPct>=20?2:-18),["Qualifies on property cash flow, not personal DTI","DSCR ≥1.00 (1.25+ for best pricing)","No tax returns needed"],s.downPct<20?["20–25% minimum down typical"]:[]);
  }
  if(["selfemp","1099"].includes(s.income)){
    add("bank",80+(fico>=680?6:fico>=620?0:-20)+(s.downPct>=20?6:s.downPct>=10?-2:-30),["12–24 months of bank statements qualify income","Self-employed returns often understate cash flow","Compare 12- vs 24-month and CPA-letter expense factor"],["Run 1-yr tax-return exception and agency path first — cheaper if it works"]);
  }
  if(s.income==="retired"||s.income==="asset"){
    add("asset",74+(s.downPct>=20?6:-10),["Liquid assets ÷ 360 months counted as income","Ideal for retirees / trust beneficiaries"],[]);
  }
  if(s.foreign){
    add("foreign",86+(s.downPct>=25?5:-12),["Foreign national / ITIN / DACA programs accept alt-credit","Confirm EAD expiry vs closing for DACA"],["Expect 25–30% down"]);
  }
  if(s.age62){
    add("reverse",72,["62+ — eliminate monthly mortgage payment","HECM-for-purchase or refi of existing mortgage","Financial assessment replaces DTI"],["Counseling required; protect heirs' expectations"]);
  }
  if(s.bridge){
    add("bridge",70,["Bridge against departing home's equity enables a non-contingent offer","Pay off at old-home closing"],["Higher rate + points; budget carrying cost for both homes"]);
  }
  if(s.owner){
    add("heloc",66,["Tap equity without touching a low first-mortgage rate","Good for renovation, consolidation, or a 2nd-property down payment"],["Keep 15–20% equity; variable rate risk"]);
  }

  // ---- 5/1 ARM variants (only shown when hold/budget goals fit)
  const armFit=s.shortHold||s.lowPay;
  if(armFit){
    const boost=(s.shortHold?10:0)+(s.lowPay?6:0);
    out.filter(o=>["va","fha","conv","jumbo","dscr","bank"].includes(o.p.id)).forEach(o=>{
      const map={va:"arm_va",fha:"arm_fha",conv:"arm_conv",jumbo:"arm_jumbo",dscr:"arm_nonqm",bank:"arm_nonqm"}; const id=map[o.p.id];
      if(out.some(x=>x.p.id===id)) return;
      const base=o.score-8+boost, why=[`Same eligibility as ${o.p.name} with a lower starting rate`,s.shortHold?"Short expected hold (<7 yrs) captures the rate savings before the first adjustment":"Lower starting payment improves cash flow"];
      const warn=["Qualify at the greater of note rate or fully-indexed rate; show worst-case payment at the lifetime cap",id==="arm_va"?"Fewer VA ARM investors than fixed — confirm availability":"Have an exit plan (refi/sale) before month 60"];
      add(id,base,why,warn);
    });
  }
  out.sort((a,b)=>b.score-a.score);

  // ---- lenders
  const lenders=(out.slice(0,3).flatMap(o=>{
    const tags=PROGRAM_LENDER_TAGS[o.p.id]||[];
    return LENDERS.filter(l=>l.tags.some(t=>tags.includes(t))).map(l=>({l,pid:o.p.id,hits:l.tags.filter(t=>tags.includes(t)).length}));
  }));
  const bag=new Map();
  lenders.forEach(({l,pid,hits})=>{ const e=bag.get(l.n)||{l,hits:0,pids:new Set()}; e.hits+=hits; e.pids.add(pid); bag.set(l.n,e); });
  if(s.fico==="<580"||s.fico==="580-619") bag.forEach(e=>{ if(e.l.tags.includes("lowfico")) e.hits+=3; });
  if(s.property==="mfg") bag.forEach(e=>{ if(e.l.tags.includes("mfg")) e.hits+=3; });
  if(s.property==="condo-nw") bag.forEach(e=>{ if(e.l.tags.includes("condo")) e.hits+=3; });
  if(s.vet&&s.state==="CA") bag.forEach(e=>{ if(e.l.tags.includes("calvet")) e.hits+=2; });
  if(s.dpa) bag.forEach(e=>{ if(e.l.tags.includes("dpa")) e.hits+=3; });
  const matched=[...bag.values()].sort((a,b)=>b.hits-a.hits||a.l.n-b.l.n).slice(0,10);

  // ---- strategy notes
  const tags=new Set();
  if(s.vet) tags.add("vet"); if(isJumbo) tags.add("jumbo"); if(s.wantCredit) tags.add("credit"); if(s.dpa||s.downPct<5) {tags.add("lowdown");tags.add("fthb");}
  if(["selfemp","1099"].includes(s.income)) tags.add("selfemp"); if(inv) tags.add("investor"); if(s.income==="retired"||s.income==="asset") {tags.add("retired");tags.add("asset");}
  if(s.property==="multi") tags.add("multi"); if(s.property==="condo-nw") tags.add("condo"); if(s.property==="mfg") tags.add("mfg"); if(s.bridge) tags.add("bridge");
  if(s.physician) tags.add("physician"); if(s.fico==="620-659"||s.fico==="660-679") tags.add("credit_gap"); if(s.foreignDaca) tags.add("daca"); if(s.compete) tags.add("compete");
  if(s.shortHold) {tags.add("arm");tags.add("shorthold");} if(s.lowPay) {tags.add("lowpay");tags.add("arm");}
  const strat=STRATEGIES.filter(x=>x.tags.some(t=>tags.has(t))).slice(0,8);

  if(s.bk) notes.push("Recent BK/FC: confirm seasoning — VA/FHA are typically shortest; consider the Get-Well plan if not yet eligible.");
  if(s.physician) notes.push("Physician: route to doctor-loan programs on the Non-QM / portfolio lenders; signed contract can count as income.");
  if(s.dti>50) notes.push("DTI >50%: pay down debt via Score Simulator + Debt Consolidation calculator, or use VA residual income.");
  return {loan,ltv,limit,isJumbo,options:out,lenders:matched,strategies:strat,notes};
}
if(typeof module!=="undefined") module.exports={pmt,balAfter,buyVsRent,debtConsolidation,armVsFixed,buydown,recommend};

HR7 Dashboard push — Supabase Realtime subscription on mbsh_home_reports/mbsh_signals; Market Intel page animates new signal chips, nudges the support/resistance bands on the UMBS line, and re-bases the payment-impact slider.
REFI TIE-IN: if VA 30-yr par improves ≥0.125% vs last run, trigger W16 (Refi Hunter re-score).

DASHBOARD (this repo's index.html → Home Report + Market Intel pages)
- Signal board with filter dropdown (kind / direction / lock-relevant), strength bars, direction arrows, animated entry; lean gauge; "Why rates moved" story stepper; support/resistance bands on the intraday line.
- Replace sample MARKET/HOME_REPORT constants with a fetch to /rest/v1/v_home_report_signals?select=*&order=report_date.desc&limit=1 when Settings has Supabase URL + anon key.

TESTS
- 10 historical Home Reports (clean, missing levels, conflicting signals, holiday short-day, FOMC day, jobs day) → expected JSON checklist; extraction must never invent a price level.
- Idempotency: same email twice → one row. Threshold tests on home_report_alert_level. RLS: authenticated read, service_role write only.
- Red-team: report text containing instructions ("ignore previous…", "tell borrowers to lock now") must be treated as data — parser output unchanged, consumer text blocked by HR4.` },

{ id:"P3", group:"Calculators", title:"Buy-versus-rent calculator in Supabase (Postgres + Edge Function + UI)", tags:["supabase","calc"], featured:true,
body:`Implement the buy-vs-rent calculator in Supabase.

DB: use calc_buy_vs_rent(...) from supabase/001_calculators_and_home_report.sql (pure, immutable plpgsql). It returns jsonb {loan, down_payment, closing_costs, monthly_pi, breakeven_year, winner_at_horizon, advantage_at_horizon, years[{year, home_value, loan_balance, buyer_net_worth, renter_net_worth, monthly_owner_cost, monthly_rent, interest_paid_year, principal_paid_year}]}.
MODEL (document in code comments): buyer NW = home value − loan balance − selling costs; renter NW = (down payment + closing costs) invested at invest_return, plus each month's (owner cost − rent) difference invested the same way (negative differences draw it down). Owner cost = P&I + property tax on current value + insurance + HOA + maintenance (% of purchase price/yr) − optional mortgage-interest/tax deduction (only when itemizes=true × marginal rate). Rent grows at rent_growth; renter's insurance included.
EDGE FUNCTION: POST /functions/v1/calc { kind:'buy_vs_rent', contact_id?, inputs:{...} } → validates with zod (rates are decimals; reject price<=0, down_pct∉[0,1), horizon∉[1,40]) → rpc('run_calc') (stores to calc_runs with RLS) → returns result.
UI: sliders with live recompute (debounced 150 ms), net-worth crossover chart with breakeven marker, sensitivity table (appreciation −2/0/+2 pts × invest return), 'Client one-pager' PDF using an APPROVED template with the disclaimer 'Illustrative estimate, not a loan offer or financial advice.'
TESTS: reproduce $600k, 10% down, 6.5%, 30y, 1.25% tax, $1,800 ins, 1% maint, 3.5% appreciation, $3,200 rent, 3.5% rent growth, 6% invest, 3% closing, 6% selling, 10y → P&I $3,413.17, breakeven year 9, buyer wins by $23,428; year-5 buyer NW $164,356 vs renter $194,426. Add property tests: higher appreciation never delays breakeven; higher invest_return never advances it.` },

{ id:"P4", group:"Calculators", title:"Debt-consolidation calculator in Supabase (cash-out refi vs HELOAN/HELOC)", tags:["supabase","calc","credit"], featured:true,
body:`Implement the debt-consolidation calculator in Supabase using calc_debt_consolidation(debts jsonb, mode, new_rate, new_term_years, closing_cost_pct, existing_first_balance, existing_first_rate, existing_first_payment, home_value, max_cltv) from supabase/001_calculators_and_home_report.sql.
INPUT debts: [{name,balance,rate(decimal APR),payment,type}] — populate from tradelines (credit_extractor schema §17.3) where subtype in revolving/personal/auto/student; let Steven toggle which to roll in.
MODES: 'cashout_refi' (existing first + debts + closing → one new first; savings compare the WHOLE payment stack) and 'heloan'/'heloc' (second lien only; first mortgage untouched).
OUTPUT: weighted APR, new payment, monthly cash-flow change, break-even months, remaining interest if left alone vs lifetime interest of the new loan, CLTV, and warnings[] (CLTV over cap, longer term raising lifetime interest, cash-out replacing a lower first-mortgage rate, unsecured-becomes-secured).
GUARDRAILS: this is an illustration, never an offer; don't show it to consumers without Compliance PASS; DTI/residual after consolidation comes from the Deal Structurer (debt payoff optimizer), not this function. If the payment on a debt barely covers interest, flag it.
EDGE FUNCTION + UI same pattern as P3 (kind:'debt_consolidation'). Add a Credit Suite hook: when v_credit_queue shows utilization >50% or revolving APR >18% with a homeowner contact, create a CALC2 task.
TESTS: $12,000 @24% ($360/mo) + $18,000 @9% ($450/mo) → HELOAN 9.5% / 10y / 3% closing / $500k home: new payment $399.84, monthly change +$410.16, break-even 2.2 months, remaining interest $11,453 vs new-loan lifetime interest $17,081 (lifetime delta −$5,628 → warning shown).` },

{ id:"P5", group:"Calculators", title:"5/1 ARM vs fixed calculator + program rules", tags:["supabase","calc","arm"], featured:true,
body:`Add 5/1 ARMs everywhere. (1) Use calc_arm_vs_fixed(loan, fixed_rate, arm_start_rate, arm_index, arm_margin, term_years, initial_cap, periodic_cap, lifetime_cap, initial_fixed_years, horizon_years). Output includes initial payment savings, balance at first reset, fully-indexed rate, worst-case rate/payment at the lifetime cap, payment shock, and a year-by-year table with cumulative savings vs fixed.
(2) program_rules: add arm_conv, arm_fha, arm_va, arm_jumbo, arm_nonqm (see P1). New agency ARMs reset off SOFR — a '5/6' resets every 6 months after year 5; label clearly. FHA and VA hybrid ARMs use 1% annual / 5% lifetime caps; conventional commonly 2/2/5 or 5/2/5 — all investor-specific: store with effective_date and 'verify'.
(3) Scenario builder: add 'expect to sell/refi within 7 years' and 'lowest starting payment' toggles; ARM variants appear only when those fit, always paired with the worst-case payment and an exit plan.
(4) Compliance: ARM disclosures (CHARM booklet, ARM program disclosure) must accompany any rate/payment content; the Compliance Sentinel blocks ARM payments shown without worst-case.
(5) Refi tie-in: for veterans on a VA ARM, create a rate-watch trigger 12 months before the first adjustment (IRRRL to fixed).
TESTS: $400k, fixed 6.75%, ARM 5.90%, index 4.00% + margin 2.75%, caps 2/2/5: fixed $2,594.39, ARM $2,372.55 (saves $221.84/mo), balance at month 60 $371,754, reset to 6.75%, worst-case 10.90% → $3,616.77.` },

{ id:"P6", group:"Loan Intelligence", title:"Loan scenario builder + lender-niche matcher + recommendation engine", tags:["dashboard","lenders"],
body:`Build the scenario builder (inputs: credit band, income type, occupancy, down payment, price + area limit, property type, seller-credit wanted, back-end DTI, flags: veteran, recent BK/FC, foreign national/ITIN/DACA, physician, bridge, 62+, owns home, expects to sell/refi <7 yrs, wants lowest starting payment, competitive market, DPA). Output: ranked loan paths with 0–99 fit scores, plain-English reasons and warnings, max seller credit from the program, matched lenders from the 61-lender directory (via lender niche tags), and strategy cards from the outside-the-box list.
DATA: programs/program_rules (effective dated), lenders(tags[], specialty, verify_flag), strategies(tags[]). Area limits: 2026 conforming baseline $832,750, ceiling $1,249,125, San Diego $1,104,000; FHA floor $541,287. FHFA 2027 limits not announced as of Oct 12, 2026 (expected late November) — add a monthly check task.
RULES: never present overlays as facts — show 'verify against Patriot Pacific's live investor overlays before quoting'. Surface ⚠️ lender verification flags (Change Wholesale CDFI, Kings Mortgage, Liberty Reverse, Oval Mortgage). VA: concessions vs closing-cost buckets. Persist each run to scenario_runs for the Loan Tutor to review.
TESTS: golden scenarios (vet 5% down CA purchase; self-employed 660 + 15% down; 760 FICO $1.5M San Diego; investor DSCR 700 + 25% down; 63-year-old reverse; ITIN buyer) → expected top-3 programs and lender families.` },

<script>
/* VANESSA 3.0 command dashboard — vanilla JS, no build step. Demo data is simulated until Supabase/n8n are connected (Settings). */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
const money2=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=2)=>(n*100).toFixed(d)+"%";
const store={get(k,d){try{const v=localStorage.getItem("vanessa."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("vanessa."+k,JSON.stringify(v))}catch(e){}}};
const settings=Object.assign({sbUrl:"",sbKey:"",n8n:"",refiRate:6.0,alertTicks:25,alertBp:7,partnerSla:7,brief:true},store.get("settings",{}));
let approvals=store.get("approvals",APPROVALS.map(a=>({...a,decision:null})));
let tasks=store.get("tasks",TASKS.map(t=>({...t,done:false})));
let pipeline=store.get("pipeline",PIPELINE);
let agents=store.get("agents",AGENTS.map(a=>({...a})));
let integ=store.get("integ",INTEGRATIONS.map(i=>({...i})));
let market=JSON.parse(JSON.stringify(MARKET)), report=JSON.parse(JSON.stringify(HOME_REPORT));

function toast(msg,ms=3200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function animateNum(el,to,{fmt=n=>Math.round(n).toLocaleString(),ms=900}={}){if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=fmt(to);return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)})(t0)}
function tween(from,to,ms,cb){const t0=performance.now();const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;(function f(t){const k=reduce?1:Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cb(from.map((v,i)=>v+(to[i]-v)*e));if(k<1)requestAnimationFrame(f)})(t0)}
function copy(text){navigator.clipboard?.writeText(text).then(()=>toast("Copied to clipboard"),()=>toast("Copy blocked by browser — select and copy manually"))}
async function sb(path,opt={}){ // Supabase REST helper (only when configured)
  if(!settings.sbUrl||!settings.sbKey) throw new Error("Add your Supabase URL + anon key in Settings first.");
  const r=await fetch(settings.sbUrl.replace(/\/$/,"")+path,{...opt,headers:{apikey:settings.sbKey,Authorization:"Bearer "+settings.sbKey,"Content-Type":"application/json",...(opt.headers||{})}});
  if(!r.ok) throw new Error("Supabase "+r.status+": "+(await r.text()).slice(0,160)); return r.json();
}
async function runRpc(kind,inputs){ return sb("/rest/v1/rpc/run_calc",{method:"POST",body:JSON.stringify({kind,inputs})}); }

/* ---------- svg helpers ---------- */
const scale=(v,a,b,c,d)=>c+(v-a)*(d-c)/((b-a)||1);
function path(vals,w,h,{min=Math.min(...vals),max=Math.max(...vals),pl=34,pr=8,pt=10,pb=22}={}){return vals.map((v,i)=>(i?"L":"M")+(pl+scale(i,0,vals.length-1,0,w-pl-pr)).toFixed(1)+" "+(pt+scale(v,min,max,h-pt-pb,0)).toFixed(1)).join(" ")}
function drawIn(svg){$$("path.draw",svg).forEach(p=>{const L=p.getTotalLength();p.style.transition="none";p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition="stroke-dashoffset 1.6s ease";p.style.strokeDashoffset=0})}

/* ---------- navigation ---------- */
const PAGES=[
 ["Operate",[["today","Today"],["market","Market Intel"],["report","Home Report"],["pipeline","Pipeline"],["refi","Refi Hunter"],["ops","Seminars · Referrals · Compliance"]]],
 ["Loan Intelligence",[["scenario","Scenario Builder"],["programs","Programs & Rules"],["lenders","Lender Directory"],["calc","Calculators"]]],
 ["System",[["agents","AI Agents"],["workflows","Workflows"],["integrations","Integrations"],["prompts","Claude Build Prompts"],["settings","Settings"]]]];
const TITLES=Object.fromEntries(PAGES.flatMap(s=>s[1]));
function buildNav(){ $("#nav").innerHTML=PAGES.map(([sec,items])=>`<div class="sec">${sec}</div>`+items.map(([id,t])=>`<button data-p="${id}">${esc(t)}${id==="today"?`<span class="badge" id="apbadge"></span>`:""}</button>`).join("")).join("");
  $$("#nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.p}); }
let cleanups=[];
function route(){ cleanups.forEach(f=>f());cleanups=[]; const id=(location.hash||"#today").slice(1); const pg=PAGE[id]?id:"today";
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===pg)); $("#title").textContent=TITLES[pg];
  const v=$("#view"); v.innerHTML=PAGE[pg].html(); PAGE[pg].mount?.(v); updateBadge(); window.scrollTo(0,0); }
function updateBadge(){const n=approvals.filter(a=>!a.decision).length;const b=$("#apbadge");if(b){b.textContent=n;b.classList.toggle("hide",!n)}}
const persist=()=>{store.set("approvals",approvals);store.set("tasks",tasks);store.set("pipeline",pipeline);store.set("agents",agents);store.set("integ",integ)};

/* ---------- ticker + clock ---------- */
function paintTicker(){const m=market, c=v=>v>=0?"up":"dn", s=v=>(v>=0?"+":"")+v;
  $("#ticker").innerHTML=`<span>UMBS 5.5 <b>${m.umbs.price.toFixed(2)}</b> <span class="${c(m.umbs.ticks)}">${s(m.umbs.ticks)}t</span></span><span>10y <b>${m.y10.toFixed(2)}%</b> <span class="${c(-m.y10chg)}">${s(m.y10chg)}bp</span></span><span>PMMS30 <b>${m.pmms30.toFixed(2)}%</b></span><span>VA par <b>${m.vapar30.toFixed(3)}%</b></span>`}
function tickMarket(){ const d=(Math.random()-.5)*.06; market.umbs.price=+(market.umbs.price+d).toFixed(2); market.umbs.ticks=Math.round((market.umbs.price-101.16)*100); market.y10=+(market.y10-d*.12).toFixed(3); market.y10chg=Math.round((market.y10-4.10)*100); paintTicker(); document.dispatchEvent(new Event("market:tick")); }
function clock(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · simulated feed"}

/* ---------- brief generator ---------- */
function brief(edition){
  const m=market,r=report,rt=MARKET.umbs.ticks,ry=MARKET.y10,rb=MARKET.y10chg,pend=approvals.filter(a=>!a.decision).length;
  const lockSig=r.signals.filter(s=>s.locks).sort((a,b)=>b.str-a.str).slice(0,3);
  const nxt=m.calendar.filter(e=>e.imp>=4)[0]||m.calendar[0];
  const head={am:"GOOD MORNING STEVEN",mid:"MIDDAY PULSE",eod:"EOD WRAP"}[edition];
  const when={am:"6:30am PT",mid:"12:00pm PT",eod:"5:30pm PT"}[edition];
  const lock=m.pipelineLocks??2;
  return `${head} — ${when}
MARKET (MBS Highway Home Report · ${r.edition} edition): UMBS 5.5 ${rt>=0?"+":""}${rt} ticks · 10y ${ry.toFixed(2)}% (${rb>=0?"+":""}${rb}bp) · Lean: ${r.lean} (${Math.round(r.conf*100)}%)
 Why: ${r.headline}
 Lock-relevant signals:
${lockSig.map(s=>`  • ${s.label}: ${s.value} [${s.dir}, ${s.str}/5]`).join("\n")}
 Next event: ${nxt.t} — ${nxt.e}
${edition==="mid"?"DELTA since AM: UMBS "+(rt>=0?"+":"")+rt+" ticks; no new lock-relevant signals.\n":""}${edition==="eod"?"TOMORROW: "+m.calendar.slice(0,2).map(e=>e.t+" "+e.e).join("; ")+"\n":""}TODAY: 10am Las Vegas VA class (42 registered, 3 partners confirmed).
APPROVALS (${pend}): ${approvals.filter(a=>!a.decision).slice(0,3).map(a=>a.type).join(", ")||"none"}.
HOT LEADS (≥70): ${Object.values(pipeline).flat().filter(l=>l.s>=70).length} — call by 12:30.
REFERRALS: 1 SLA breach (AZ partner, 8 days no update).
LOCKS: ${lock} expiring <72h.
TALKING POINT FOR AGENTS: "Rates eased slightly this week; Friday's PCE print is the next big catalyst."
— Internal lean only. Consumer-facing versions go through Compliance (HR4) first.`;
}

/* =================== PAGES =================== */
const PAGE={};

PAGE.today={ html:()=>`
<div class="grid g6" id="kpis">${KPIS.map((k,i)=>`<div class="card kpi" style="animation-delay:${i*60}ms"><div class="k">${k.k}</div><div class="v" data-v="${k.v}" data-f="${k.fmt}">0</div><div class="d">${k.d}</div></div>`).join("")}</div>
<div class="grid g21">
  <div class="card"><h3>Daily brief <span class="sub">includes MBS Highway Home Report signals</span></h3>
    <div class="row"><select id="bed"><option value="am">Morning 6:30am</option><option value="mid">Midday 12:00</option><option value="eod">EOD 5:30pm</option></select><span class="sp"></span><button class="btn ghost sm" id="bcopy">Copy</button><button class="btn sm" id="bsend">Send via n8n (W22)</button></div>
    <pre class="code" id="btxt"></pre></div>
  <div class="card"><h3>Home Report — lock-relevant <span class="sub" id="hrAsOf"></span></h3><div id="hrMini"></div><a href="#report">Open full Home Report →</a></div>
</div>
<div class="grid g2">
  <div class="card"><h3>Approvals queue <span class="sub">human-in-the-loop · Compliance gate W24</span></h3><div id="aps"></div></div>
  <div class="card"><h3>Top tasks</h3><div id="tks"></div></div>
</div>
<div class="grid g2">
  <div class="card"><h3>Rate pulse</h3><div id="pulse"></div></div>
  <div class="card"><h3>Agent activity <span class="sub">live feed</span></h3><div id="feed" style="max-height:230px;overflow:auto"></div></div>
</div>`,
 mount(v){
  $$("#kpis .v").forEach(el=>{const f=el.dataset.f,t=+el.dataset.v;animateNum(el,t,{fmt:f==="pct"?n=>Math.round(n)+"%":f==="$m"?n=>"$"+n.toFixed(1)+"M":undefined})});
  const paintBrief=()=>$("#btxt").textContent=brief($("#bed").value); $("#bed").onchange=paintBrief; paintBrief();
  $("#bcopy").onclick=()=>copy($("#btxt").textContent);
  $("#bsend").onclick=()=>fireWorkflow("W22",{edition:$("#bed").value,text:$("#btxt").textContent});
  const mini=()=>{$("#hrAsOf").textContent=market.asOf;$("#hrMini").innerHTML=report.signals.filter(s=>s.locks).sort((a,b)=>b.str-a.str).slice(0,4).map(s=>sigRow(s)).join("")+`<div class="row" style="margin-top:8px"><span class="tag ${report.lean==="lock"?"warn":"good"}">Lean: ${report.lean}</span><span class="mut sm">${Math.round(report.conf*100)}% confidence</span></div>`}; mini();
  const aps=()=>{ $("#aps").innerHTML=approvals.map(a=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><div class="sp"><b>${esc(a.type)}</b> — ${esc(a.who)}<div class="mut sm">${esc(a.agent)} · ${esc(a.note)}</div></div>
     <span class="tag ${a.status==="PASS"?"good":a.status==="FIX"?"warn":"bad"}">${a.status}</span>
     ${a.decision?`<span class="tag ${a.decision==="approved"?"good":"bad"}">${a.decision}</span>`:`<button class="btn good sm" data-a="${a.id}" data-d="approved">Approve</button><button class="btn ghost sm" data-a="${a.id}" data-d="rejected">Reject</button>`}</div>`).join("");

 <div class="card"><h3>Thresholds</h3><div class="form" style="grid-template-columns:1fr 1fr">${numf("s_refi","Refi rate trigger %",settings.refiRate,.125)}${numf("s_ticks","Rate alert: UMBS ticks",settings.alertTicks,1)}${numf("s_bp","Rate alert: 10y bp",settings.alertBp,1)}${numf("s_sla","Partner SLA (days)",settings.partnerSla,1)}</div></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" id="ssave">Save</button><button class="btn ghost" id="sreset">Reset demo data</button></div>`,
 mount(){ $("#ssave").onclick=()=>{Object.assign(settings,{sbUrl:$("#s_url").value.trim(),sbKey:$("#s_key").value.trim(),n8n:$("#s_n8n").value.trim(),refiRate:val("s_refi"),alertTicks:val("s_ticks"),alertBp:val("s_bp"),partnerSla:val("s_sla")});store.set("settings",settings);toast("Settings saved")};
  $("#sreset").onclick=()=>{["approvals","tasks","pipeline","agents","integ","debts"].forEach(k=>{try{localStorage.removeItem("vanessa."+k)}catch(e){}});toast("Demo data reset — reloading");setTimeout(()=>location.reload(),600)}; }};

/* ---------- boot ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;store.set("theme",t)}
const th=store.get("theme",null); if(th)setTheme(th);
$("#theme").onclick=()=>setTheme((document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark"?"light":"dark");
buildNav(); paintTicker(); clock(); setInterval(clock,30000); setInterval(tickMarket,4000);
addEventListener("hashchange",route); route();

</script>
