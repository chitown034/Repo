<title>Lexicon 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Charis+SIL:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reference book on screen. A sticky masthead with one search box; a thumb-index rail
   (colour-coded like the cut tabs on a printed dictionary) switches between volumes; each volume
   is a list/reader split that stacks on phones. */
:root{
  --paper:#F3F5F9; --sheet:#FFFFFF; --sunk:#E9ECF3; --ink:#151A2C; --ink-2:#4B5169; --ink-3:#767C95;
  --rule:#D9DDE7; --accent:#2B45C4; --mark:#F5C64F;
  --c-overview:#151A2C; --c-encyclopedia:#2B45C4; --c-dictionary:#AE2D47; --c-thesaurus:#0F766F;
  --c-rhymes:#6A3DB3; --c-origins:#A85F0E; --c-roots:#3B7A27; --c-almanac:#355A80;
  --good:#1D7A43; --warn:#A86A00; --bad:#B3263E; --info:#2B45C4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ipa:"Charis SIL", "Doulos SIL", "Gentium Plus", "Lucida Sans Unicode", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(21,26,44,.06), 0 4px 18px rgba(21,26,44,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1120; --sheet:#161A2C; --sunk:#1D2236; --ink:#E7E9F3; --ink-2:#AEB3C9; --ink-3:#7F859E;
  --rule:#2A3049; --accent:#93A5FF; --mark:#C99A2E;
  --c-overview:#E7E9F3; --c-encyclopedia:#93A5FF; --c-dictionary:#F2849A; --c-thesaurus:#5CCBC0;
  --c-rhymes:#B89BF4; --c-origins:#EBA85E; --c-roots:#8CC772; --c-almanac:#8FB3D9;
  --good:#5BC98A; --warn:#E5B04D; --bad:#F2849A; --info:#93A5FF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1120; --sheet:#161A2C; --sunk:#1D2236; --ink:#E7E9F3; --ink-2:#AEB3C9; --ink-3:#7F859E;
  --rule:#2A3049; --accent:#93A5FF; --mark:#C99A2E;
  --c-overview:#E7E9F3; --c-encyclopedia:#93A5FF; --c-dictionary:#F2849A; --c-thesaurus:#5CCBC0;
  --c-rhymes:#B89BF4; --c-origins:#EBA85E; --c-roots:#8CC772; --c-almanac:#8FB3D9;
  --good:#5BC98A; --warn:#E5B04D; --bad:#F2849A; --info:#93A5FF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.ipa{font-family:var(--f-ipa)}
.muted{color:var(--ink-2)}
.tiny{font-size:.78rem}
.eyebrow{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
mark{background:color-mix(in srgb,var(--mark) 55%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.mast-in{display:flex;align-items:center;gap:16px;padding-block:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.search{position:relative;flex:1;min-width:0;max-width:640px}
.search input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:9px 16px 9px 38px;font-family:var(--f-ui);font-size:.95rem}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh;overflow:auto;padding:6px;z-index:40}
.sres .grp{padding:6px 10px 2px}
.sres button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer}
.sres button:hover,.sres button.on{background:var(--sunk)}
.sres button .k{font-family:var(--f-ui);font-weight:600}
.sres button .d{color:var(--ink-2);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mast-tools{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;font-family:var(--f-ui);font-size:.85rem;gap:6px}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* Shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;max-width:1400px;margin:0 auto;padding-block:22px 60px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-2);font-family:var(--f-ui);font-weight:600;font-size:.95rem;padding:9px 12px 9px 14px;border-radius:0 8px 8px 0;border-left:4px solid var(--tc);background:transparent;position:relative}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab.on{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.tab .ct{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);font-weight:400}
.rail .foot{margin-top:14px;padding:12px 14px;font-size:.78rem;color:var(--ink-3);font-family:var(--f-ui);line-height:1.45}
main{min-width:0}

/* Section header */
.sh{display:flex;flex-wrap:wrap;align-items:end;gap:10px 24px;margin-bottom:18px;border-bottom:3px solid var(--sc);padding-bottom:12px}
.sh h1{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:800;letter-spacing:-.02em}
.sh p{margin:0;color:var(--ink-2);max-width:62ch;font-size:.98rem}
.sh .eyebrow{color:var(--sc)}

/* Generic */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-family:var(--f-ui);font-size:.84rem;cursor:pointer;color:var(--ink);text-decoration:none;line-height:1.4}
.chip:hover{border-color:var(--sc,var(--accent));color:var(--sc,var(--accent))}
.chip.on{background:var(--sc,var(--accent));border-color:var(--sc,var(--accent));color:var(--sheet)}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip .n{font-family:var(--f-mono);font-size:.72rem;opacity:.75;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.v-documented{color:var(--good)} .v-plausible{color:var(--info)} .v-disputed{color:var(--warn)} .v-myth{color:var(--bad)}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 12px;font-family:var(--f-ui);font-size:.92rem;min-width:0}
.in:focus{outline:none;border-color:var(--sc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--sc,var(--accent)) 20%,transparent)}
select.in{padding-right:28px}
.btn{border:0;background:var(--sc,var(--accent));color:var(--sheet);border-radius:8px;padding:8px 16px;font-family:var(--f-ui);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-family:var(--f-ui)}
hr.soft{border:0;border-top:1px solid var(--rule);margin:16px 0}

/* Split list/reader */
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.list .lh{padding:10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.list .lb{max-height:calc(100vh - 230px);overflow:auto;overscroll-behavior:contain}
.list .lg{position:sticky;top:0;background:var(--sunk);font-family:var(--f-display);font-weight:800;color:var(--sc);padding:3px 14px;font-size:.85rem;z-index:1}
.list a{display:flex;justify-content:space-between;gap:8px;padding:6px 14px;text-decoration:none;color:var(--ink);font-family:var(--f-ui);font-size:.92rem;border-left:3px solid transparent}
.list a:hover{background:var(--sunk)}
.list a.on{border-left-color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,var(--sheet));font-weight:600}
.list a small{color:var(--ink-3);font-family:var(--f-mono);font-size:.7rem;white-space:nowrap}
.list .cnt{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);padding:6px 14px;border-top:1px solid var(--rule)}

.reader{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(18px,3vw,34px);min-width:0}
.reader h2.hw{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:800;letter-spacing:-.025em;word-break:break-word}
.hwline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:6px}
.hwline .ipa{font-size:1.2rem;color:var(--ink-2)}
.hwline .syl{font-family:var(--f-mono);font-size:.9rem;color:var(--ink-3)}
.pos{font-family:var(--f-text);font-style:italic;color:var(--sc)}
.defs{margin:18px 0 0;padding-left:1.4em;font-size:1.08rem;max-width:68ch}
.defs li{margin-bottom:6px;padding-left:4px}
.defs li::marker{font-family:var(--f-display);font-weight:800;color:var(--sc)}
.example{margin:14px 0 0;font-style:italic;color:var(--ink-2);border-left:3px solid var(--rule);padding-left:14px;max-width:68ch}
.box{background:var(--sunk);border-radius:8px;padding:14px 16px;margin-top:18px;max-width:72ch}
.box h4{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.box p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:.92rem}
.kv dt{font-family:var(--f-ui);color:var(--ink-3);font-size:.82rem;padding-top:2px}
.kv dd{margin:0}
.rowmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.lvl{font-family:var(--f-ui);font-size:.75rem;color:var(--ink-2);display:inline-flex;gap:3px;align-items:center}
.lvl i{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--rule)}
.lvl i.f{background:var(--sc)}
.sub{margin-top:22px}
.sub h3{font-size:1rem;font-family:var(--f-ui);font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sub h3 small{font-weight:400;color:var(--ink-3);font-size:.8rem}
.star{background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--f-ui);font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.star svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.star.on{color:var(--warn);border-color:var(--warn)}
.star.on svg{fill:currentColor}

/* Encyclopedia article */
.art{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}
.art .body p{margin:0 0 14px;max-width:68ch;font-size:1.05rem}
.art .body p:first-child::first-letter{font-family:var(--f-display);font-weight:800;float:left;font-size:3.1em;line-height:.85;padding:4px 8px 0 0;color:var(--sc)}
.lede{font-size:1.18rem;color:var(--ink-2);max-width:62ch;margin:10px 0 20px}
.factbox{background:var(--sunk);border-radius:8px;padding:14px;align-self:start;border-top:4px solid var(--sc)}
.factbox h4{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.factbox dl{margin:0;display:flex;flex-direction:column;gap:9px}
.factbox dt{font-family:var(--f-ui);font-size:.75rem;color:var(--ink-3)}
.factbox dd{margin:0;font-size:.93rem}

/* Timeline */
.tl{position:relative;padding-left:22px;border-left:2px solid var(--rule);margin-left:8px}
.tl .ti{position:relative;margin-bottom:12px}
.tl .ti::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:3px solid var(--tc,var(--sc))}
.tl .yr{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3)}

/* Overview */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.wotd{position:relative;overflow:hidden;border-top:5px solid var(--c-dictionary)}
.wotd h2{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.03em;margin-top:6px;word-break:break-word}
.wotd h2 a{color:inherit;text-decoration:none;background-image:linear-gradient(transparent 62%,color-mix(in srgb,var(--mark) 55%,transparent) 62%)}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--ink);border-left:4px solid var(--tc)}
.stat:hover{box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-ui);font-size:.82rem;color:var(--ink-2)}
.stat small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);margin-top:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chart h3{font-size:1.05rem;margin-bottom:2px}
.chart .cap{font-size:.82rem;color:var(--ink-3);font-family:var(--f-ui);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-family:var(--f-ui);fill:var(--ink-2);font-size:11px}
.chart svg .v{fill:var(--ink);font-family:var(--f-mono);font-size:10.5px}
.hbar{display:flex;flex-direction:column;gap:5px}
.hbar .r{display:grid;grid-template-columns:118px minmax(0,1fr) 40px;gap:8px;align-items:center;font-family:var(--f-ui);font-size:.82rem}
.hbar .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .t{background:var(--sunk);border-radius:4px;height:14px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--bc,var(--accent));border-radius:4px}
.hbar .r b{font-family:var(--f-mono);font-weight:400;font-size:.76rem;text-align:right}
.stackbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0 10px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-ui);font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--lc)}
.tools2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}

/* Thesaurus */
.sense{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
.sense:first-of-type{border-top:0;padding-top:0}
.sense .g{font-family:var(--f-ui);font-weight:600;margin-bottom:8px}
.sense .g em{font-style:normal;font-family:var(--f-mono);color:var(--sc);margin-right:8px;font-size:.85rem}
.syn{display:flex;flex-wrap:wrap;gap:6px}
.syn a{font-family:var(--f-text);font-size:1rem;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--sc) 9%,var(--sheet));border:1px solid color-mix(in srgb,var(--sc) 25%,var(--rule));padding:3px 10px;border-radius:6px}
.syn a:first-child{font-weight:600}
.syn a:hover{border-color:var(--sc)}
.syn.ant a{background:color-mix(in srgb,var(--bad) 7%,var(--sheet));border-color:color-mix(in srgb,var(--bad) 22%,var(--rule))}
.syn .lab{font-family:var(--f-ui);font-size:.75rem;color:var(--ink-3);align-self:center;margin-right:4px;text-transform:uppercase;letter-spacing:.06em}
.scale{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:8px}
.scale .side{display:flex;flex-wrap:wrap;gap:5px}
.scale .side.l{justify-content:flex-end}
.scale .mid{font-family:var(--f-display);font-weight:800;padding:6px 14px;border-radius:999px;background:var(--sc);color:var(--sheet)}
.gradbar{height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 20%,var(--sheet)),var(--sc));margin-top:8px}
.scale-lab{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:.72rem;color:var(--ink-3);margin-top:3px}

/* Rhymes */
.rhyme-in{display:flex;gap:8px;flex-wrap:wrap}
.rhyme-in input{font-family:var(--f-display);font-size:1.4rem;font-weight:600;flex:1;min-width:0;padding:10px 16px}
.rcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:14px}
.rcol h4{font-family:var(--f-ui);font-size:.8rem;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between}
.rwords{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:1.02rem}
.rwords a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--rule)}
.rwords a:hover{color:var(--sc);border-color:var(--sc)}
.rwords a.has{border-bottom:1px solid color-mix(in srgb,var(--sc) 50%,transparent)}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fam{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.fam:hover{border-color:var(--sc)}
.fam b{font-family:var(--f-display);font-size:1.1rem}
.fam span{font-family:var(--f-ipa);color:var(--ink-3);font-size:.9rem}
.fam small{font-family:var(--f-mono);color:var(--ink-3);font-size:.7rem}
.sylcount{display:inline-flex;gap:4px;align-items:center;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2)}
.sylcount i{width:10px;height:10px;border-radius:50%;background:var(--sc);display:inline-block}

/* Origins */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.subtabs a{font-family:var(--f-ui);font-weight:600;padding:8px 14px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs a.on{color:var(--ink);border-bottom-color:var(--sc)}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.ocard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:90px}
.ocard.hl{box-shadow:0 0 0 2px var(--sc)}
.ocard h3{font-size:1.2rem;font-weight:700}
.ocard .m{font-style:italic;color:var(--ink-2);margin:0}
.ocard .o{margin:0;font-size:.95rem}
.ocard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3);margin-top:auto;align-items:center}
.loan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.loan h3{font-size:1.1rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.loan h3 small{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);font-weight:400}
.loan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.loan li b{font-family:var(--f-ui)}
.loan li span{color:var(--ink-2)}

/* Roots */
.tblwrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet)}
table.t td{padding:8px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.el{font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.kind{font-family:var(--f-ui);font-size:.72rem;padding:2px 8px;border-radius:5px;background:var(--sunk);white-space:nowrap}
.builder-out{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:stretch}
.morph{border-radius:8px;padding:8px 12px;background:var(--sunk);border-top:3px solid var(--mc,var(--sc));min-width:70px}
.morph b{font-family:var(--f-display);font-size:1.15rem;display:block}
.morph span{font-size:.8rem;color:var(--ink-2);font-family:var(--f-ui)}
.morph.unk{border-top-color:var(--rule);opacity:.7}

/* Almanac */
.alm-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.count b{font-family:var(--f-display);font-size:2.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--c-almanac);line-height:1}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.month{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.month h4{font-family:var(--f-display);font-size:1rem;margin-bottom:6px;display:flex;justify-content:space-between}
.month h4 small{font-family:var(--f-mono);font-weight:400;color:var(--ink-3);font-size:.7rem}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;font-family:var(--f-ui);font-size:.75rem;text-align:center}
.mg .dh{color:var(--ink-3);font-size:.66rem;padding-bottom:2px}
.mg button{background:none;border:0;border-radius:5px;padding:4px 0 6px;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;color:var(--ink)}
.mg button:hover{background:var(--sunk)}
.mg button.we{color:var(--ink-3)}
.mg button.has{font-weight:700}
.mg button .dots{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px}
.mg button .dots i{width:4px;height:4px;border-radius:50%;background:var(--dc)}
.mg button.sel{background:var(--c-almanac);color:var(--sheet)}
.mg button.today{outline:1.5px solid var(--accent)}
.evlist{display:flex;flex-direction:column;gap:2px}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.ev:last-child{border-bottom:0}
.ev .dt{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.ev .dt b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.ev h4{font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev p{margin:2px 0 0;font-size:.92rem;color:var(--ink-2)}
.catdot{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:.72rem;color:var(--ink-3);font-weight:400}
.catdot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.anniv{display:flex;flex-direction:column;gap:8px}
.anniv div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:baseline;font-size:.93rem}
.anniv b{font-family:var(--f-display);font-weight:800;color:var(--c-almanac);font-size:1.15rem;text-align:right}
.anniv small{font-family:var(--f-mono);color:var(--ink-3);font-size:.72rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--f-ui);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50}

@media (max-width:1100px){ .art{grid-template-columns:1fr} .two{grid-template-columns:minmax(0,1fr)} .ov-hero{grid-template-columns:1fr} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:14px;padding-block:12px 50px}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;flex-direction:row;overflow-x:auto;background:var(--paper);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px));gap:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .tab{border-left:0;border-bottom:3px solid var(--tc);border-radius:8px 8px 0 0;white-space:nowrap;padding:7px 12px;font-size:.88rem}
  .tab .ct,.rail .foot{display:none}
  .split{grid-template-columns:1fr}
  .list{position:static}
  .list .lb{max-height:300px}
  .brand span{display:none}
  .mast-in{gap:10px}
  .mast-tools .lbl{display:none}
  .mast-tools .iconbtn{padding:0}
}
@media (max-width:480px){ .ev{grid-template-columns:72px minmax(0,1fr)} .hbar .r{grid-template-columns:90px minmax(0,1fr) 34px} .scale{grid-template-columns:1fr} .scale .side.l{justify-content:flex-start} }
@media (prefers-reduced-motion:no-preference){ .reader,.ocards,.months{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(4px)}to{transform:none}} }
</style>

      <div class="sres" id="sres" hidden></div>
    </div>

      <button class="iconbtn" id="randBtn" title="Open a random entry"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span class="lbl">Random</span></button>
      <button class="iconbtn" id="themeBtn" title="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl">Theme</span></button>
    </div>
  </div>
</header>
