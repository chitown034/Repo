persona:
  name: Steven
  company: LPT Realty
  role: 'Broker Associate & Mortgage Loan Originator (DRE #01988316, NMLS #2449246)'
  email: steven@YOUR-SENDING-DOMAIN.com
  linkedin: ''
  tone: plain-spoken, warm, organized, no hype (retired Navy Chief)
product:
  name: Lending and real estate partner for your clients
  description: 'A California broker associate (LPT Realty) who is also a licensed mortgage loan originator. Helps
    local professionals serve clients who need to buy, sell or refinance a home: VA and military families (Camp
    Pendleton, Miramar, NB San Diego, March ARB), first-time buyers, divorce and probate/trust sales, and investors,
    across Temecula Valley and San Diego County. One point of contact for the loan and the transaction, fast pre-approvals,
    and clear updates to the referring professional.'
  pricing: No cost to partners. No referral fees or kickbacks (RESPA Section 8); clients choose their own providers.
  key_benefits:
  - VA, FHA, conventional and jumbo financing plus the real estate side under one licensed professional
  - 'Military PCS specialist: remote tours, e-signing and timelines built around orders'
  - Divorce, probate and trust sales handled with court and attorney timelines in mind
  - Same-day pre-approval conversations and a written status update to you at every milestone
  - Local data on Temecula, Murrieta, Menifee, Winchester, French Valley and San Diego communities
  objection_responses:
    already have a lender: Makes sense. Most attorneys and agents keep a short bench; I am happy to be the VA/military
      option when a client needs one.
    we do not refer: Understood, and no referral fees either way. If a client ever asks who handles VA loans or
      a probate sale locally, I am an easy name to give.
    not interested: No problem at all. I will not follow up again.
    send me something: 'Sure: a one-page overview of how I keep referring professionals updated. What is the best
      email?'
  offer:
    primary: A short intro call to see whether your clients could use a VA-savvy lender and agent
    entry: A one-page partner overview and a sample client update
    goal: book_call
    booking_method: calendar_link
    booking_url: https://tidycal.com/stevenshearrill/discovery-call
    meeting_duration: 15 minutes
    meeting_owner: Steven
