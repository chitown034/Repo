<style>
/* Layout: sticky command bar + tab rail; one 1200px operating column; tables scroll inside their own wrappers. */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F4F5F8; --ink:#15223A; --muted:#58637A; --line:#D3D8E1;
  --accent:#8F6418; --accent-ink:#FFFFFF; --accent-soft:#F2E6CF; --navy:#1F3A64; --navy-soft:#DCE5F3;
  --good:#2C7A4B; --good-soft:#DDF0E4; --warn:#9A5B00; --warn-soft:#F8E8CC; --bad:#B0281F; --bad-soft:#F7DEDB;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#141F33; --surface-2:#1A2740; --ink:#E5EAF3; --muted:#9BA7BD; --line:#2A3A56;
  --accent:#D8A957; --accent-ink:#1A1408; --accent-soft:#3A2F1B; --navy:#93B5EA; --navy-soft:#1E3152;
  --good:#5FC78E; --good-soft:#173A29; --warn:#E5A445; --warn-soft:#3D2C12; --bad:#F27B6F; --bad-soft:#431D1A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#141F33; --surface-2:#1A2740; --ink:#E5EAF3; --muted:#9BA7BD; --line:#2A3A56;
  --accent:#D8A957; --accent-ink:#1A1408; --accent-soft:#3A2F1B; --navy:#93B5EA; --navy-soft:#1E3152;
  --good:#5FC78E; --good-soft:#173A29; --warn:#E5A445; --warn-soft:#3D2C12; --bad:#F27B6F; --bad-soft:#431D1A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--navy)} a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h2{font-size:1.9rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.7rem;font-weight:700;text-transform:uppercase}
.brand .call{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.brand .star{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;color:var(--muted);padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:28px}
.lede{color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.cols{display:grid;gap:18px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols>*{min-width:0}
.cols-3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.cols-3>*{min-width:0}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .s{font-size:.8rem;color:var(--muted)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.edit td{padding:4px 6px}
table.edit input,table.edit select{width:100%;min-width:90px;font:inherit;font-size:.86rem;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px}
table.edit input:hover,table.edit select:hover{border-color:var(--line)}
table.edit input:focus,table.edit select:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
table.edit input[type=number]{text-align:right;font-family:var(--f-mono)}
table.edit td.wide input{min-width:200px}
/* controls */
.btn{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.del{font:inherit;font-size:.75rem;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.del:hover{color:var(--bad)}
.del.armed{background:var(--bad);color:#fff}
input.field,select.field,textarea.field{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea.field{min-height:110px;resize:vertical;font-size:.9rem}
label.lbl{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
/* pills */
.pill{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brass{background:var(--accent-soft);color:var(--accent)}
.ex{font-family:var(--f-mono);font-size:.62rem;padding:1px 5px;border:1px dashed var(--muted);color:var(--muted);border-radius:3px;margin-right:4px}
/* progress */
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--accent)}
.prog.good>i{background:var(--good)}
/* venture cards */
.vcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;border-top:3px solid var(--line)}
.vcard:hover{border-color:var(--accent)}
.vcard.h-good{border-top-color:var(--good)} .vcard.h-warn{border-top-color:var(--warn)} .vcard.h-bad{border-top-color:var(--bad)}
.vcard h3{font-size:1.3rem}
.vcard .m{font-size:.85rem;color:var(--muted)}
.vmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
/* checklists */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:4px;font-size:.88rem;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin-top:3px;accent-color:var(--accent);flex:none;width:16px;height:16px}
.chk.done span{color:var(--muted);text-decoration:line-through}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:2px}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
ol.steps>li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-mono);font-size:.78rem;color:var(--accent);padding-top:8px}
/* callouts */
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 6px 6px 0;font-size:.9rem}
.callout.navy{border-left-color:var(--navy);background:var(--navy-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.fig{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.fig b{font-family:var(--f-display);font-size:2rem;color:var(--accent);line-height:1}
.fig span{font-size:.84rem;color:var(--muted)}
/* resources */
.res{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.res a{font-weight:600;text-decoration:none}
.res a:hover{text-decoration:underline}
.res p{font-size:.84rem;color:var(--muted)}
.res .host{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.lane h4{margin:0;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.dealcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
.dealcard b{font-weight:600}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.out{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.9rem}
.out dt{color:var(--muted)} .out dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.out .big{font-size:1.1rem;font-weight:600}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .barfill{fill:var(--accent)} svg .bartrack{fill:var(--surface-2)} svg .barval{fill:var(--ink)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;font-size:.85rem;z-index:20}
.muted{color:var(--muted)} .small{font-size:.82rem}
.back{font-family:var(--f-mono);font-size:.78rem;text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.stat{border-right:0;border-bottom:1px solid var(--line)} h2{font-size:1.6rem}}
</style>

const $=s=>document.querySelector(s);
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const money=n=>{n=+n||0;const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M";if(a>=1e4)return "$"+Math.round(n/1e3)+"k";return "$"+Math.round(n).toLocaleString();};

function daysUntil(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function checkItem(id,text){const on=!!S.checks[id];return `<label class="chk ${on?"done":""}"><input type="checkbox" data-check="${h(id)}" ${on?"checked":""}><span>${h(text)}</span></label>`;}
function phaseList(prefix,items){return items.map((t,i)=>checkItem(`${prefix}:${i}`,t)).join("");}

/* Editable table: cols = [{k,label,type,opts,wide}] */
function table(key,cols,opts){opts=opts||{};const rows=S[key];
 let out=`<div class="tbl-wrap"><table class="edit"><thead><tr>${cols.map(c=>`<th class="${c.type==="num"?"r":""}">${h(c.label)}</th>`).join("")}${opts.extra?`<th class="r">${h(opts.extra.label)}</th>`:""}<th></th></tr></thead><tbody>`;
 if(!rows.length)out+=`<tr><td colspan="${cols.length+2}" class="muted small">No rows yet. Add the first one below.</td></tr>`;
 rows.forEach((r,i)=>{out+="<tr>"+cols.map((c,ci)=>{const id=`${key}-${i}-${c.k}`;const v=r[c.k]==null?"":r[c.k];
   const tag=ci===0&&r.ex?`<span class="ex" title="Example row">EX</span>`:"";
   let input;
   if(c.type==="select")input=`<select id="${id}" data-bind="${key}:${i}:${c.k}">${c.opts.map(o=>`<option ${o==v?"selected":""}>${h(o)}</option>`).join("")}</select>`;
   else input=`<input id="${id}" data-bind="${key}:${i}:${c.k}" type="${c.type==="num"?"number":c.type==="date"?"date":"text"}" value="${h(v)}" aria-label="${h(c.label)}">`;
   return `<td class="${c.wide?"wide":""}"><div style="display:flex;align-items:center">${tag}${input}</div></td>`;}).join("")
  +(opts.extra?`<td class="r num" data-extra="${key}:${i}">${opts.extra.fn(r)}</td>`:"")
  +`<td><button class="del" data-del="${key}:${i}">Delete</button></td></tr>`;});
 out+=`</tbody></table></div><div class="btn-row"><button class="btn" data-add="${key}">+ Add row</button>${rows.some(r=>r.ex)?`<button class="btn ghost" data-clearex="${key}">Remove example rows</button>`:""}</div>`;
 return out;}

function calcOut(c){
 const loanPct=Math.max(0,100-c.down-c.seller)/100;
 const sba=c.price*loanPct, seller=c.price*c.seller/100, down=c.price*c.down/100;
 const pmt=(P,r,y)=>{if(!P)return 0;const i=r/100/12,n=y*12;return i?P*i/(1-Math.pow(1+i,-n)):P/n;};
 const sbaM=pmt(sba,c.rate,c.years), selM=pmt(seller,c.srate,c.syears);
 const debt=(sbaM+selM)*12;
 const cashflow=c.sde-c.mgr;
 const dscr=debt?cashflow/debt:0;
 const cashIn=down+c.price*c.closing/100;
 const free=cashflow-debt;
 const coc=cashIn?free/cashIn*100:0;
 const mult=c.sde?c.price/c.sde:0;
 const cls=dscr>=1.5?"good":dscr>=1.25?"warn":"bad";
 return `<dl class="out">
 <dt>Multiple of SDE</dt><dd>${mult.toFixed(2)}x</dd>
 <dt>Down payment</dt><dd>${fullMoney(down)}</dd>
 <dt>SBA loan</dt><dd>${fullMoney(sba)}</dd>
 <dt>Seller note</dt><dd>${fullMoney(seller)}</dd>
 <dt>Monthly debt service</dt><dd>${fullMoney(sbaM+selM)}</dd>
 <dt>Annual debt service</dt><dd>${fullMoney(debt)}</dd>
 <dt>Cash flow after manager salary</dt><dd>${fullMoney(cashflow)}</dd>
 <dt class="big">DSCR</dt><dd class="big"><span class="pill ${cls}" style="font-size:.8rem">${dscr.toFixed(2)}x</span></dd>
 <dt>Free cash flow after debt</dt><dd>${fullMoney(free)}</dd>
 <dt>Cash needed at close</dt><dd>${fullMoney(cashIn)}</dd>
 <dt class="big">Cash-on-cash return</dt><dd class="big">${coc.toFixed(1)}%</dd></dl>
 <p class="small muted" style="margin-top:8px">Lenders usually want DSCR of 1.25x or better; 1.5x+ leaves room for surprises. Manager salary is subtracted because you plan to hire an operator.</p>`;
}

   <dt>Planning range</dt><dd>Fractional: $3k–$8k/month · Full-time: $95k–$140k base + profit share. Verify against your local market.</dd></dl></div>
  <div class="panel sec"><h3>Hiring process</h3><ol class="steps">${["Write the scorecard: mission, outcomes, competencies","Post on veteran channels: Hiring Our Heroes, SkillBridge, LinkedIn, plus general boards","15-minute screening call on outcomes, not résumé","Paid work sample: turn a recorded walkthrough into an SOP and automation plan","Structured career-history interview","Reference calls (at least three, including a former boss)","Offer with a 30-60-90 plan, scorecard and bonus tied to KPIs"].map(s=>`<li><p class="small" style="padding-top:6px">${h(s)}</p></li>`).join("")}</ol></div>
 </div>
 <div class="cols">
  <div class="panel sec"><h3>30-60-90 plan</h3>${phaseList("o90",["Days 1–30: Shadow each venture; inventory every recurring task and tool","Days 1–30: Take over the weekly meeting and this dashboard","Days 31–60: Write SOPs for the top 10 processes; hire a virtual assistant","Days 31–60: Build the first three automations from the Automation tab","Days 61–90: Fully own two ventures; founder only reviews the scorecard","Days 61–90: Present the hiring plan for venture-level managers"])}</div>
  <div class="panel sec"><h3>Delegation levels</h3>
   <div class="tbl-wrap"><table><thead><tr><th>Level</th><th>Operator does</th></tr></thead><tbody>
   ${[["1","Does exactly what was asked"],["2","Researches and brings options"],["3","Recommends; founder decides"],["4","Decides and informs founder after"],["5","Owns it fully; reports in the weekly scorecard"]].map(r=>`<tr><td class="num">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
   </tbody></table></div><p class="small muted">Write the level next to each responsibility. Aim for level 4–5 on daily operations within 90 days.</p></div>
 </div>
 <div class="callout">Hiring veterans? Check whether the Work Opportunity Tax Credit is currently authorized, and consider hosting DoD SkillBridge interns, who can work with you during their last months of service.</div>
 <div class="sec"><h3>Hiring tracker</h3>
 ${table("hires",[{k:"role",label:"Role",wide:true},{k:"venture",label:"Venture",type:"select",opts:VNAMES},{k:"type",label:"Type",type:"select",opts:["Full-time","Part-time","Contract","Fractional","Intern / SkillBridge"]},{k:"status",label:"Status",type:"select",opts:["Scorecard","Sourcing","Interviewing","Offer","Hired","Paused"]},{k:"start",label:"Target start",type:"date"},{k:"comp",label:"Comp"}])}</div>`;

VIEWS.automation=()=>{
 const hrs=S.autos.filter(a=>a.status==="Live").reduce((s,a)=>s+(+a.hours||0),0);
 return `<div class="sec"><div class="eyebrow">Run it without you</div><h2>Automation</h2><p class="lede">Shared services at the HoldCo plus automations per venture. Live automations currently save <b class="num" id="hrsTot">${hrs}</b> hours a month.</p></div>
 <div class="sec"><h3>Shared tech stack</h3>
 <div class="tbl-wrap"><table><thead><tr><th>Function</th><th>Options</th><th>Used by</th></tr></thead><tbody>
 ${[["CRM & marketing","GoHighLevel, HubSpot; Wealthbox for advisory; mortgage CRM for MLO","All"],["Workflow automation","Make, Zapier, n8n","All"],["Accounting","QuickBooks Online per entity; Fathom or Reach for consolidation","HoldCo"],["Payroll & HR","Gusto or Rippling","HoldCo shared service"],["Projects & SOPs","ClickUp or Notion; Loom for walkthroughs","All"],["Documents & e-sign","Google Workspace, DocuSign","All"],["AI assistants","Meeting notes, inbox triage, proposal drafting, research agents","All"],["Phone & SMS","Business phone system with call recording where lawful","MLO, Real Estate, MFO"]].map(r=>`<tr><td><b>${r[0]}</b></td><td class="small">${r[1]}</td><td class="small">${r[2]}</td></tr>`).join("")}
 </tbody></table></div></div>
 <div class="sec"><h3>Automation build queue</h3>
 ${table("autos",[{k:"process",label:"Process",wide:true},{k:"venture",label:"Venture",type:"select",opts:VNAMES},{k:"tool",label:"Tool"},{k:"status",label:"Status",type:"select",opts:["Planned","Building","Live","Paused"]},{k:"hours",label:"Hours saved / mo",type:"num"}])}</div>
 <div class="sec"><h3>Recipes by venture</h3><div class="cols-3">
 ${VENTURES.map(v=>`<div class="panel"><a href="#v-${v.id}"><b>${h(v.name)}</b></a><ul class="plain" style="margin-top:8px">${v.automation.map(a=>`<li>${h(a)}</li>`).join("")}</ul></div>`).join("")}</div></div>
 <div class="panel sec"><h3>Automation maturity</h3>${phaseList("auto",["Every recurring task is written down as an SOP","Every lead lands in a CRM automatically","Bank feeds connect to bookkeeping for every entity","Invoices and payment reminders send automatically","Weekly KPIs pull into one scorecard without manual entry","Client and partner onboarding run from templates","AI drafts first versions of proposals, reports and follow-ups; a person approves"])}</div>`;
};

VIEWS.ideas=()=>`
 <div class="sec"><div class="eyebrow">Potential ventures</div><h2>New ventures</h2><p class="lede">Score ideas from 1 to 5 before committing time or money. The score weights fit with what you already own and your veteran advantage.</p></div>
 ${table("ideas",[{k:"idea",label:"Idea",wide:true},{k:"market",label:"Market (1–5)",type:"num"},{k:"fit",label:"Fit w/ HoldCo",type:"num"},{k:"capital",label:"Low capital",type:"num"},{k:"speed",label:"Speed to cash",type:"num"},{k:"vet",label:"Veteran edge",type:"num"}],{extra:{label:"Score /100",fn:ideaScore}})}
 <div class="panel sec"><h3>Gate before launch</h3>${phaseList("gate",["Ten conversations with real buyers","Someone has paid or signed a letter of intent","An operator could run it within 12 months","It uses at least one existing venture (leads, licenses, capital, certifications)","Downside is capped and known"])}</div>`;
function ideaScore(r){const w={market:.25,fit:.25,capital:.15,speed:.15,vet:.2};let s=0;for(const k in w)s+=Math.max(0,Math.min(5,+r[k]||0))/5*w[k];return Math.round(s*100);}

function resCard(r){let host="";try{host=new URL(r[2]).hostname.replace(/^www\./,"");}catch(e){}return `<div class="res"><a href="${h(r[2])}" target="_blank" rel="noopener">${h(r[1])}</a><p>${h(r[3])}</p><span class="host">${h(host)}</span></div>`;}
let resFilter="All",resQ="";
VIEWS.resources=()=>{const cats=["All",...new Set(RESOURCES.map(r=>r[0]))];
 return `<div class="sec"><div class="eyebrow">${RESOURCES.length} links</div><h2>Resource library</h2><p class="lede">Official programs and tools for every venture. Government links are .gov unless noted.</p></div>
 <div class="btn-row"><input class="field" id="resQ" placeholder="Search resources" value="${h(resQ)}" style="max-width:320px"></div>
 <div class="filters">${cats.map(c=>`<button class="chipbtn" data-cat="${h(c)}" aria-pressed="${c===resFilter}">${h(c)}</button>`).join("")}</div>
 <div class="cols-3" id="resGrid">${resGrid()}</div>`;};
function resGrid(){const q=resQ.toLowerCase();const list=RESOURCES.filter(r=>(resFilter==="All"||r[0]===resFilter)&&(!q||(r[1]+" "+r[3]).toLowerCase().includes(q)));return list.length?list.map(resCard).join(""):`<p class="muted">No resources match. Clear the search or pick another category.</p>`;}

VIEWS.backup=()=>`
 <div class="sec"><div class="eyebrow">Your data</div><h2>Backup & restore</h2><p class="lede">Everything you enter is stored in this browser only. Copy the backup text into a safe place regularly, and paste it here to restore on another device.</p></div>
 <div class="cols">
  <div class="panel sec"><h3>Export</h3><textarea class="field" id="exportBox" readonly style="min-height:200px">${h(JSON.stringify(S))}</textarea><div class="btn-row"><button class="btn primary" id="copyBtn">Copy backup</button></div></div>
  <div class="panel sec"><h3>Restore</h3><textarea class="field" id="importBox" style="min-height:200px" placeholder="Paste backup text here"></textarea><div class="btn-row"><button class="btn primary" id="importBtn">Restore from backup</button><button class="btn" id="resetBtn">Reset to examples</button></div><p class="small muted" id="resetNote"></p></div>
 </div>`;

/* =========================================================
   ROUTER + EVENTS
   ========================================================= */
function route(){
 const key=(location.hash||"#overview").slice(1);
 const app=$("#app");
 let html,tab=key;
 if(key.startsWith("v-")){const v=VENTURES.find(x=>"v-"+x.id===key);html=v?ventureView(v):VIEWS.overview();tab="ventures";}
 else html=(VIEWS[key]||VIEWS.overview)();
 if(!VIEWS[key]&&!key.startsWith("v-"))tab="overview";
 app.innerHTML=`<div class="view">${html}</div>`;
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<a href="#${k}" ${k===tab?'aria-current="page"':""}>${l}</a>`).join("");
 const cur=$("#tabs [aria-current]");if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});

function refreshDerived(key){
 if(key==="funding"&&$("#fundTot"))$("#fundTot").textContent=fullMoney(S.funding.reduce((a,f)=>a+(+f.amount||0),0));
 if(key==="autos"&&$("#hrsTot"))$("#hrsTot").textContent=S.autos.filter(a=>a.status==="Live").reduce((s,a)=>s+(+a.hours||0),0);
 if(key==="deals"&&$("#kanban"))$("#kanban").innerHTML=kanban();
 document.querySelectorAll(`[data-extra^="${key}:"]`).forEach(td=>{const i=+td.dataset.extra.split(":")[1];const r=S[key][i];if(!r)return;td.textContent=key==="ideas"?ideaScore(r):(+r.sde?(+r.price/+r.sde).toFixed(2)+"x":"—");});
}

document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.bind){const [key,i,k]=t.dataset.bind.split(":");const row=S[key][+i];if(!row)return;row[k]=t.type==="number"?(t.value===""?0:+t.value):t.value;save();refreshDerived(key);}
 else if(t.dataset.check!==undefined&&t.dataset.check){const id=t.dataset.check;if(t.checked)S.checks[id]=true;else delete S.checks[id];save();t.closest(".chk").classList.toggle("done",t.checked);
   const sec=t.closest(".phase");if(sec){const pill=sec.querySelector(".phase-h .pill");if(pill){const all=sec.querySelectorAll("input[type=checkbox]");const n=[...all].filter(x=>x.checked).length;pill.textContent=`${n}/${all.length}`;pill.classList.toggle("good",n===all.length);}}}
 else if(t.dataset.vmeta){const [vid,k]=t.dataset.vmeta.split(":");S.vmeta[vid]=Object.assign({},S.vmeta[vid]||{},{[k]:t.value});save();toast("Saved");}
 else if(t.dataset.kpi){const [vid,k]=t.dataset.kpi.split(":");S.kpi[vid]=Object.assign({},S.kpi[vid]||{},{[k]:t.value===""?null:+t.value});save();const y=window.scrollY;route();window.scrollTo(0,y);}
 else if(t.dataset.note){S.notes[t.dataset.note]=t.value;save();toast("Notes saved");}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.calc){S.calc[t.dataset.calc]=+t.value||0;save();$("#calcOut").innerHTML=calcOut(S.calc);}
 if(t.id==="resQ"){resQ=t.value;$("#resGrid").innerHTML=resGrid();}
});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.add){const key=t.dataset.add;S[key].push(Object.assign({},BLANK[key]));save();const y=window.scrollY;route();window.scrollTo(0,y);const inp=document.getElementById(`${key}-${S[key].length-1}-${Object.keys(BLANK[key])[0]}`);if(inp)inp.focus();}
 else if(t.dataset.del){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirm";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Delete";}},3000);return;}
   const [key,i]=t.dataset.del.split(":");S[key].splice(+i,1);save();const y=window.scrollY;route();window.scrollTo(0,y);toast("Row deleted");}
 else if(t.dataset.clearex){const key=t.dataset.clearex;S[key]=S[key].filter(r=>!r.ex);save();const y=window.scrollY;route();window.scrollTo(0,y);toast("Example rows removed");}
 else if(t.dataset.cat){resFilter=t.dataset.cat;document.querySelectorAll("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===resFilter));$("#resGrid").innerHTML=resGrid();}
 else if(t.id==="copyBtn"){const box=$("#exportBox");const txt=box.value;const fallback=()=>{box.focus();box.select();toast("Selected. Press Ctrl/Cmd+C to copy");};
   try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),fallback);}catch(err){fallback();}}
 else if(t.id==="importBtn"){try{const d=JSON.parse($("#importBox").value);if(typeof d!=="object"||!d)throw 0;S=Object.assign(defaults(),d);save();toast("Restored");location.hash="#overview";route();}catch(err){toast("That text isn't a valid backup. Paste the full export.");}}
 else if(t.id==="resetBtn"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirm reset";$("#resetNote").textContent="This replaces everything with the example data. Click again to confirm.";return;}
   S=defaults();save();toast("Reset to examples");route();}
});
route();save();
</script>
