<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#D8A957; --accent-ink:#1A1408; --accent-soft:#3A2F1B; --navy:#93B5EA; --navy-soft:#1E3152;
  --good:#5FC78E; --good-soft:#173A29; --warn:#E5A445; --warn-soft:#3D2C12; --bad:#F27B6F; --bad-soft:#431D1A; color-scheme:dark;}}
:root[data-theme="dark"]{

  --accent:#D8A957; --accent-ink:#1A1408; --accent-soft:#3A2F1B; --navy:#93B5EA; --navy-soft:#1E3152;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--navy)} a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h2{font-size:1.9rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.7rem;font-weight:700;text-transform:uppercase}
.brand .call{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.brand .star{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;color:var(--muted);padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:28px}
.lede{color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.cols{display:grid;gap:18px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols>*{min-width:0}
.cols-3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.cols-3>*{min-width:0}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .s{font-size:.8rem;color:var(--muted)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.edit td{padding:4px 6px}
table.edit input,table.edit select{width:100%;min-width:90px;font:inherit;font-size:.86rem;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px}
table.edit input:hover,table.edit select:hover{border-color:var(--line)}
table.edit input:focus,table.edit select:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
table.edit input[type=number]{text-align:right;font-family:var(--f-mono)}
table.edit td.wide input{min-width:200px}
/* controls */
.btn{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.del{font:inherit;font-size:.75rem;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.del:hover{color:var(--bad)}
.del.armed{background:var(--bad);color:#fff}
input.field,select.field,textarea.field{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea.field{min-height:110px;resize:vertical;font-size:.9rem}
label.lbl{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
/* pills */
.pill{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brass{background:var(--accent-soft);color:var(--accent)}
.ex{font-family:var(--f-mono);font-size:.62rem;padding:1px 5px;border:1px dashed var(--muted);color:var(--muted);border-radius:3px;margin-right:4px}
/* progress */
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--accent)}
.prog.good>i{background:var(--good)}
/* venture cards */
.vcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;border-top:3px solid var(--line)}
.vcard:hover{border-color:var(--accent)}
.vcard.h-good{border-top-color:var(--good)} .vcard.h-warn{border-top-color:var(--warn)} .vcard.h-bad{border-top-color:var(--bad)}
.vcard h3{font-size:1.3rem}
.vcard .m{font-size:.85rem;color:var(--muted)}
.vmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
/* checklists */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:4px;font-size:.88rem;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin-top:3px;accent-color:var(--accent);flex:none;width:16px;height:16px}
.chk.done span{color:var(--muted);text-decoration:line-through}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:2px}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
ol.steps>li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-mono);font-size:.78rem;color:var(--accent);padding-top:8px}
/* callouts */
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 6px 6px 0;font-size:.9rem}
.callout.navy{border-left-color:var(--navy);background:var(--navy-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.fig{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.fig b{font-family:var(--f-display);font-size:2rem;color:var(--accent);line-height:1}
.fig span{font-size:.84rem;color:var(--muted)}
/* resources */
.res{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.res a{font-weight:600;text-decoration:none}
.res a:hover{text-decoration:underline}
.res p{font-size:.84rem;color:var(--muted)}
.res .host{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.lane h4{margin:0;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.dealcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
.dealcard b{font-weight:600}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.out{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.9rem}
.out dt{color:var(--muted)} .out dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.out .big{font-size:1.1rem;font-weight:600}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .barfill{fill:var(--accent)} svg .bartrack{fill:var(--surface-2)} svg .barval{fill:var(--ink)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;font-size:.85rem;z-index:20}
.muted{color:var(--muted)} .small{font-size:.82rem}
.orgnode{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);font-size:.85rem}
.orgnode span{color:var(--muted);font-size:.8rem}
.orgnode.lead{border-left:3px solid var(--accent);background:var(--surface)}
table.edit input.wk{min-width:56px;width:62px;padding:5px 4px}
table.sc td.sc-good{background:var(--good-soft)} table.sc td.sc-bad{background:var(--bad-soft)}

svg .spark{fill:none;stroke:var(--accent);stroke-width:1.6} svg .goal{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1} svg .sparkdot{fill:var(--accent)}

.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;font-size:.86rem;min-width:0}
.alert.bad{border-left-color:var(--bad)} .alert span:last-child{min-width:0;overflow-wrap:anywhere}
kbd{font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface-2);color:var(--muted)}
.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(10,16,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(10vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}

.modal-card{position:relative;width:min(640px,100%);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-x{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1}
.pal{font-size:1rem;padding:10px 12px}
.pal-list{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.pal-item{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:8px 10px;cursor:pointer;text-decoration:none}
.pal-item span{min-width:0;overflow-wrap:anywhere} .pal-item small{color:var(--muted);font-family:var(--f-mono);font-size:.68rem;white-space:nowrap}
.pal-item.on,.pal-item:hover{background:var(--accent-soft)}
textarea.cap{min-height:74px}
table.tasks tr.tdone input:not([type=checkbox]){text-decoration:line-through;color:var(--muted)}
table.edit input.late{color:var(--bad);font-weight:600}
.tchk{width:16px;height:16px;accent-color:var(--accent)}
.ai-out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:4px;padding:12px 14px;font-size:.88rem;max-width:80ch}
tr.flash td{background:var(--accent-soft)}
#savedNote[data-sync="synced"]{color:var(--good)} #savedNote[data-sync="offline"],#savedNote[data-sync="error"],#savedNote[data-sync="full"],#savedNote[data-sync="big"]{color:var(--warn)}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.agent{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;min-width:0}
.agent:hover{border-color:var(--accent)} .agent.on{border-color:var(--accent);background:var(--accent-soft)}
.agent .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.agent b{display:block;font-size:.92rem} .agent small{display:block;color:var(--muted);font-size:.74rem;overflow-wrap:anywhere}
.back{font-family:var(--f-mono);font-size:.78rem;text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.stat{border-right:0;border-bottom:1px solid var(--line)} h2{font-size:1.6rem}}
</style>

const money=n=>{n=+n||0;if(n<0)return "-"+money(-n);const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M";if(a>=1e4)return "$"+Math.round(n/1e3)+"k";return "$"+Math.round(n).toLocaleString();};
const fullMoney=n=>{n=Math.round(+n||0);return (n<0?"-$":"$")+Math.abs(n).toLocaleString();};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}
function vmeta(v){return Object.assign({},v.defaults,S.vmeta[v.id]||{});}
function vprogress(v){let tot=0,done=0;v.phases.forEach((p,pi)=>p[1].forEach((_,ii)=>{tot++;if(S.checks[`${v.id}:${pi}:${ii}`])done++;}));return{tot,done,pct:tot?Math.round(done/tot*100):0};}
function healthPill(k){return `<span class="pill ${k}">${HEALTH[k]||k}</span>`;}
function daysUntil(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function checkItem(id,text){const on=!!S.checks[id];return `<label class="chk ${on?"done":""}"><input type="checkbox" data-check="${h(id)}" ${on?"checked":""}><span>${h(text)}</span></label>`;}
function phaseList(prefix,items){return items.map((t,i)=>checkItem(`${prefix}:${i}`,t)).join("");}

/* Editable table: cols = [{k,label,type,opts,wide}] */
const EXTRA={},SUMMARY={};
function table(key,cols,opts){opts=opts||{};const rows=S[key];if(opts.extra)EXTRA[key]=opts.extra.fn;if(opts.sum)SUMMARY[key]=opts.sum;
 let out=`${opts.sum?`<div id="sum-${key}">${opts.sum()}</div>`:""}<div class="tbl-wrap"><table class="edit"><thead><tr>${cols.map(c=>`<th class="${c.type==="num"?"r":""}">${h(c.label)}</th>`).join("")}${opts.extra?`<th class="r">${h(opts.extra.label)}</th>`:""}<th></th></tr></thead><tbody>`;
 if(!rows.length)out+=`<tr><td colspan="${cols.length+2}" class="muted small">No rows yet. Add the first one below.</td></tr>`;
 rows.forEach((r,i)=>{out+="<tr>"+cols.map((c,ci)=>{const id=`${key}-${i}-${c.k}`;const v=r[c.k]==null?"":r[c.k];
   const tag=ci===0&&r.ex?`<span class="ex" title="Example row">EX</span>`:"";
   let input;
   if(c.type==="select")input=`<select id="${id}" data-bind="${key}:${i}:${c.k}">${c.opts.map(o=>`<option ${o==v?"selected":""}>${h(o)}</option>`).join("")}</select>`;
   else input=`<input id="${id}" data-bind="${key}:${i}:${c.k}" type="${c.type==="num"?"number":c.type==="date"?"date":"text"}" value="${h(v)}" aria-label="${h(c.label)}">`;
   return `<td class="${c.wide?"wide":""}"><div style="display:flex;align-items:center">${tag}${input}</div></td>`;}).join("")
  +(opts.extra?`<td class="r num" data-extra="${key}:${i}">${opts.extra.fn(r)}</td>`:"")
  +`<td><button class="del" data-del="${key}:${i}">Delete</button></td></tr>`;});
 out+=`</tbody></table></div><div class="btn-row"><button class="btn" data-add="${key}">+ Add row</button><button class="btn ghost" data-csv="${key}">Export CSV</button>${rows.some(r=>r.ex)?`<button class="btn ghost" data-clearex="${key}">Remove example rows</button>`:""}</div>`;
 return out;}

function calcOut(c){
 const loanPct=Math.max(0,100-c.down-c.seller)/100;
 const sba=c.price*loanPct, seller=c.price*c.seller/100, down=c.price*c.down/100;
 const pmt=(P,r,y)=>{if(!P)return 0;const i=r/100/12,n=y*12;return i?P*i/(1-Math.pow(1+i,-n)):P/n;};
 const sbaM=pmt(sba,c.rate,c.years), selM=pmt(seller,c.srate,c.syears);
 const debt=(sbaM+selM)*12;
 const cashflow=c.sde-c.mgr;
 const dscr=debt?cashflow/debt:0;
 const cashIn=down+c.price*c.closing/100;
 const free=cashflow-debt;
 const coc=cashIn?free/cashIn*100:0;
 const mult=c.sde?c.price/c.sde:0;
 const cls=dscr>=1.5?"good":dscr>=1.25?"warn":"bad";
 return `<dl class="out">
 <dt>Multiple of SDE</dt><dd>${mult.toFixed(2)}x</dd>
 <dt>Down payment</dt><dd>${fullMoney(down)}</dd>
 <dt>SBA loan</dt><dd>${fullMoney(sba)}</dd>
 <dt>Seller note</dt><dd>${fullMoney(seller)}</dd>
 <dt>Monthly debt service</dt><dd>${fullMoney(sbaM+selM)}</dd>
 <dt>Annual debt service</dt><dd>${fullMoney(debt)}</dd>
 <dt>Cash flow after manager salary</dt><dd>${fullMoney(cashflow)}</dd>
 <dt class="big">DSCR</dt><dd class="big"><span class="pill ${cls}" style="font-size:.8rem">${dscr.toFixed(2)}x</span></dd>
 <dt>Free cash flow after debt</dt><dd>${fullMoney(free)}</dd>
 <dt>Cash needed at close</dt><dd>${fullMoney(cashIn)}</dd>
 <dt class="big">Cash-on-cash return</dt><dd class="big">${coc.toFixed(1)}%</dd></dl>
 <p class="small muted" style="margin-top:8px">Lenders usually want DSCR of 1.25x or better; 1.5x+ leaves room for surprises. Manager salary is subtracted because you plan to hire an operator.</p>`;
}

function sumStrip(items){return `<div class="stats" style="margin-bottom:10px">${items.map(([k,v])=>`<div class="stat"><span class="k">${h(k)}</span><span class="v" style="font-size:1.6rem">${h(v)}</span></div>`).join("")}</div>`;}
function ul(a){return `<ul class="plain">${a.map(x=>`<li>${h(x)}</li>`).join("")}</ul>`;}
function stepList(a){return `<ol class="steps">${a.map(s=>`<li><p class="small" style="padding-top:6px">${h(s)}</p></li>`).join("")}</ol>`;}
function staticTable(head,rows,firstBold){return `<div class="tbl-wrap"><table><thead><tr>${head.map(x=>`<th>${h(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?"small":""}">${i||!firstBold?h(c):`<b>${h(c)}</b>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}

function ventureExtra(v){const d=DETAIL[v.id];if(!d)return "";const t=VTRACK[v.id];
 let track="";
 if(t&&t.key)track=`<div class="sec"><h3>${h(t.title)}</h3>${table(t.key,t.cols,{extra:t.extra,sum:t.sum})}</div>`;
 else if(t)track=`<div class="callout navy"><a href="${t.link}">${h(t.label)} →</a></div>`;
 return `${track}
 <div class="cols">
  <div class="panel sec"><h3>Ideal customers</h3>${ul(d.icp)}</div>
  <div class="panel sec"><h3>Revenue streams</h3>${ul(d.rev)}</div>
  <div class="panel sec"><h3>Numbers that matter</h3>${ul(d.num)}</div>
  <div class="panel sec phase"><div class="phase-h"><h3>First 90 days</h3><span class="pill">${d.r90.filter((_,i)=>S.checks[`r90:${v.id}:${i}`]).length}/${d.r90.length}</span></div>${phaseList(`r90:${v.id}`,d.r90)}</div>
 </div>
 <div class="sec"><h3>Risks & mitigations</h3>${staticTable(["Risk","Mitigation"],d.risks,true)}</div>
 <div class="cols">
  <div class="panel sec phase"><div class="phase-h"><h3>SOPs to write</h3><span class="pill">${d.sops.filter((_,i)=>S.checks[`sop:${v.id}:${i}`]).length}/${d.sops.length}</span></div>${phaseList(`sop:${v.id}`,d.sops)}<p class="small muted">Track them company-wide in <a href="#playbooks">Playbooks</a>.</p></div>
  <div class="panel sec"><h3>Team build</h3>${staticTable(["Role","Hire when"],d.roles,true)}</div>
 </div>`;}

/* ---------- Scorecard ---------- */
function scClass(r,v){if(v===""||v==null)return "";const g=+r.goal;return (r.dir==="<="?+v<=g:+v>=g)?"sc-good":"sc-bad";}
function spark(r,wks){const vals=wks.map(w=>r.w&&r.w[w]!=null&&r.w[w]!==""?+r.w[w]:null);const nums=vals.filter(v=>v!=null);if(!nums.length)return `<span class="muted small">—</span>`;
 const W=96,H=26,max=Math.max(+r.goal||0,...nums),min=Math.min(+r.goal||0,...nums),rng=max-min||1;const x=i=>2+i*(W-4)/(wks.length-1),y=v=>H-3-(v-min)/rng*(H-6);
 const pts=vals.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");const li=vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line class="goal" x1="2" x2="${W-2}" y1="${y(+r.goal||0)}" y2="${y(+r.goal||0)}"/><polyline class="spark" points="${pts}"/><circle class="sparkdot" cx="${x(li)}" cy="${y(vals[li])}" r="2.5"/></svg>`;}
function scoreRow(r,i,wks){return `<tr data-scrow="${i}">
 <td class="wide"><div style="display:flex;align-items:center">${r.ex?'<span class="ex">EX</span>':""}<input id="score-${i}-measure" data-bind="score:${i}:measure" value="${h(r.measure)}" aria-label="Measure"></div></td>
 <td><input id="score-${i}-owner" data-bind="score:${i}:owner" value="${h(r.owner)}" aria-label="Owner"></td>
 <td><select id="score-${i}-dir" data-bind="score:${i}:dir" aria-label="Direction"><option ${r.dir===">="?"selected":""}>&gt;=</option><option ${r.dir==="<="?"selected":""}>&lt;=</option></select></td>
 <td><input type="number" id="score-${i}-goal" data-bind="score:${i}:goal" value="${h(r.goal)}" aria-label="Goal"></td>
 ${wks.map(w=>{const v=r.w&&r.w[w]!=null?r.w[w]:"";return `<td class="${scClass(r,v)}"><input class="wk" type="number" id="sc-${i}-${w}" data-sc="${i}|${w}" value="${h(v)}" aria-label="Week of ${w}"></td>`;}).join("")}
 <td data-spark="${i}">${spark(r,wks)}</td>
 <td><button class="del" data-del="score:${i}">Delete</button></td></tr>`;}
VIEWS.scorecard=()=>{const wks=mondays(13);const last=wks[wks.length-2];const R=S.score;
 const hit=R.filter(r=>r.w&&r.w[last]!=null&&r.w[last]!==""&&scClass(r,r.w[last])==="sc-good").length;const rep=R.filter(r=>r.w&&r.w[last]!=null&&r.w[last]!=="").length;
 return `<div class="sec"><div class="eyebrow">13-week view</div><h2>Weekly scorecard</h2><p class="lede">5–15 numbers that tell you, in five minutes, whether the portfolio is on track. Enter each week's number on Monday. Green meets the goal, red misses it. Review it first in the weekly meeting.</p></div>
 ${sumStrip([["Measures",R.length],["Hit goal last week",`${hit} / ${rep||0}`],["Week of",last]])}
 <div class="tbl-wrap"><table class="edit sc"><thead><tr><th>Measure</th><th>Owner</th><th>Rule</th><th class="r">Goal</th>${wks.map(w=>`<th class="r">${w.slice(5).replace("-","/")}</th>`).join("")}<th>Trend</th><th></th></tr></thead><tbody>${R.map((r,i)=>scoreRow(r,i,wks)).join("")}</tbody></table></div>
 <div class="btn-row"><button class="btn" id="addScore">+ Add measure</button>${R.some(r=>r.ex)?`<button class="btn ghost" data-clearex="score">Remove example rows</button>`:""}</div>
 <div class="cols">
  <div class="panel sec"><h3>Good measures</h3>${ul(["Leading activity you control (calls, bids, deals reviewed), not only results","One owner per measure","A clear weekly goal and direction","Pulled from a system automatically where possible","Red two weeks in a row becomes an issue in the weekly meeting"])}</div>
  <div class="panel sec"><h3>Suggested measures by venture</h3>${staticTable(["Venture","Measure"],[["Mortgage","Applications, locks, loans funded, realtor meetings"],["Family Office","Discovery meetings, plans delivered, new households"],["AI Company","Demos, pilots started, MRR, support tickets open"],["Real Estate","Properties analyzed, offers made, occupancy, rent collected %"],["GovCon","Opportunities qualified, Sources Sought answered, bids submitted"],["Acquisitions","Deals reviewed, owner conversations, LOIs"],["Nonprofit","Founders enrolled, mentor hours, dollars raised"],["Grants / Research","Topics screened, proposals in progress"],["HoldCo","Cash by entity, AR over 30 days, open hires"]],true)}</div>
 </div>`;};

VIEWS.incentives=()=>`
 <div class="sec"><div class="eyebrow">Money the government leaves on the table</div><h2>Incentives, SBA loans & tax strategy</h2><p class="lede">State incentives that reward growth, government-backed loans that let you keep ownership, and the federal tax rules (QSBS, Section 179 and bonus depreciation, historic and New Markets credits, the R&D credit) that turn profits into reinvestment. Laid out in the same order as the video you shared.</p></div>

 <div class="sec"><div class="eyebrow">Part 1</div><h3>State incentives that reward business growth</h3>
 <div class="cols">
  <div class="panel sec"><h3>What states offer</h3>${staticTable(["Incentive","How it works"],[["Deal-closing cash grants","Negotiated grants for projects a state wants to win (e.g., Texas Enterprise Fund)"],["Job creation tax credits","A credit per new job, often higher in rural or distressed counties"],["Workforce training","Free or reimbursed training for new hires (e.g., Georgia Quick Start, Louisiana FastStart)"],["Property tax abatements","Reduced local property taxes for new investment"],["Sales tax exemptions","On manufacturing equipment, data centers, R&D"],["Infrastructure grants","Roads, water, utilities paid for a project site"],["State R&D credits","Add-on to the federal R&D credit"],["Small business grants and loans","Direct programs, often through state small business or veteran offices"],["Zone programs","Extra benefits in enterprise, opportunity or revitalization zones"]],true)}</div>
  <div class="panel sec"><h3>How states compete for entrepreneurs</h3>${ul(["Most big incentives are discretionary and negotiated, not an automatic form","States pay for results: jobs, wages above the county average, and capital investment","Many programs require a 'but for' test: the project must plausibly go elsewhere without the incentive","Announcing or signing a lease first can disqualify you; talk to the agency before you commit","Agreements include clawbacks if you miss job or investment targets","Local governments often must match state money","Wage thresholds matter: higher-paying jobs earn bigger awards","Rural and distressed areas get richer incentives"])}</div>

 <div class="cols">
  <div class="panel sec"><div class="eyebrow">Part 3</div><h3>Finding and applying for business incentives</h3>${stepList(["Write a one-page project profile: new jobs, average wage, capital investment, timeline, locations you're considering","Call the local economic development organization (city or county EDO) first; they know every state and local program","Meet the state economic development agency's business recruitment or small business team","Ask the SBDC and VBOC for small-business and veteran programs the big agencies don't handle","Compare total value: grants, credits, training, abatements, and site costs","Apply before you announce, sign a lease, or start construction","Negotiate the performance agreement: job counts, wage levels, timeline, clawbacks","Calendar every compliance report; missed reports can cost you the incentive","Track everything in the incentives tracker above"])}</div>
  <div class="panel sec"><div class="eyebrow">Part 4</div><h3>Why the government supports small businesses</h3>${ul(["Small businesses create a large share of new jobs","Local ownership keeps profits and spending in the community","Tax revenue grows when businesses grow; incentives are an investment in that base","Revitalizing distressed areas costs less with private businesses doing the work","Veteran ownership is a stated federal priority (5% SDVOSB contracting goal, veteran SBA fee relief)","Banks lend more when the government shares the risk through guarantees"])}<h3 style="margin-top:12px">What this means for you</h3>${ul(["Each venture can stack several programs","Your veteran status adds contracting preference and some loan fee relief","Plan incentives before you buy, build, hire or relocate"])}</div>
 </div>

 <div class="sec"><div class="eyebrow">Part 5</div><h3>SBA loans that let you keep ownership</h3>
 <p class="small">SBA doesn't usually lend directly. It guarantees part of a bank's loan, so banks say yes to deals they'd otherwise decline, with longer terms and lower down payments. You keep 100% of your equity, unlike raising money from investors.</p>
 ${staticTable(["Loan","Best for","Max amount","Typical term","Notes"],[["SBA 7(a)","Buying a business, working capital, equipment, partner buyouts, refinancing","$5M","Up to 10 yrs (25 yrs with real estate)","Main loan for acquisitions; variable or fixed rate with SBA-capped spreads"],["SBA Express","Faster, smaller loans and lines of credit","$500k","Up to 10 yrs (7 for lines)","Lender decides faster; veteran-owned businesses have had upfront fee relief"],["SBA 504","Owner-occupied real estate and long-life equipment","CDC portion often up to $5M–$5.5M per project","10, 20 or 25 yrs fixed","Bank ~50%, CDC ~40%, you ~10% down"],["CAPLines","Seasonal, contract and working capital lines","$5M","Up to 10 yrs","Useful for government contract working capital"],["Export loans","Businesses selling overseas","Varies by program","Varies","Export Express and Export Working Capital"],["Microloans","Startups and small working-capital needs","$50k","Up to 7 yrs","Through nonprofit lenders; includes counseling"],["Military Reservist EIDL","Business hurt when an essential employee is called up","$2M","Up to 30 yrs","Disaster-loan program; low fixed rate"]],true)}
 <div class="cols" style="margin-top:14px">
  <div class="panel sec"><h3>Here's how to get an SBA loan</h3>${stepList(["Check basics: for-profit US business, operating in an eligible industry, owners meet SBA's citizenship and residency rules (tightened in SBA SOP 50 10 8.1), and you can't get reasonable credit elsewhere","Know your numbers: credit score, personal financial statement, 3 years of tax returns, and projected debt coverage of at least 1.15x (most lenders want 1.25x+)","Prepare the package: SBA Form 1919, SBA Form 413, business plan, projections, use of proceeds, resumes, and the purchase agreement or LOI for acquisitions","Use SBA Lender Match and talk to 2–3 SBA Preferred Lenders (PLP lenders can approve in-house)","Compare rate, fees, term, prepayment penalty, collateral and guarantee requirements","Expect a personal guarantee from every 20%+ owner","Close, then keep financials current; most loans require annual statements"])}</div>
  <div class="panel sec"><h3>2025–2026 rule changes to know</h3>${ul(["SOP 50 10 8 (effective June 1, 2025) restored a 10% minimum equity injection for startups and complete changes of ownership","A seller note can count toward that injection only if it's on full standby (no payments) for the life of the SBA loan, and generally for no more than half of it","Citizenship and residency requirements were tightened in the later 8.1 revision; check the current SOP before applying","Veteran-owned (51%+) Express loans have had upfront guaranty fees waived; confirm the current fiscal-year fee notice"])}<p class="small muted">Sources summarize these rules differently. Have your lender confirm against the current SOP 50 10 text.</p></div>

  <div class="panel sec"><h3>Who qualifies</h3>${ul(["Domestic C-corporation (not an LLC taxed as a partnership or an S-corp)","Stock acquired at original issuance for cash, property or services, not bought from another shareholder","At least 80% of assets used in an active qualified business","Excluded fields include health, law, accounting, consulting, financial services, brokerage, banking, insurance, investing and hospitality"])}</div>
  <div class="panel sec"><h3>Fit across your ventures</h3>${staticTable(["Venture","QSBS fit"],[["AI Company","Strong candidate if formed as a C-corp"],["Acquired product or trades businesses","Possible if bought as a new C-corp and not in an excluded field"],["Military Family Office","Excluded (financial services)"],["Mortgage Broker / MLO","Excluded (brokerage / financing)"],["Gov Contracts (consulting)","Often excluded if the work is consulting"],["Real Estate","Excluded (real estate holding)"]],true)}</div>

 <div class="sec"><div class="eyebrow">Part 7</div><h3>Writing off business equipment immediately</h3>
 <div class="cols">

});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.add){const key=t.dataset.add;S[key].push(Object.assign({},BLANK[key]));save();const y=window.scrollY;route();window.scrollTo(0,y);const inp=document.getElementById(`${key}-${S[key].length-1}-${Object.keys(BLANK[key])[0]}`);if(inp)inp.focus();}
 else if(t.dataset.del){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirm";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Delete";}},3000);return;}
   const [key,i]=t.dataset.del.split(":");S[key].splice(+i,1);save();const y=window.scrollY;route();window.scrollTo(0,y);toast("Row deleted");}
 else if(t.dataset.clearex){const key=t.dataset.clearex;S[key]=S[key].filter(r=>!r.ex);save();const y=window.scrollY;route();window.scrollTo(0,y);toast("Example rows removed");}
 else if(t.dataset.cat){resFilter=t.dataset.cat;document.querySelectorAll("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===resFilter));$("#resGrid").innerHTML=resGrid();}
 else if(t.id==="copyBtn"){const box=$("#exportBox");const txt=box.value;const fallback=()=>{box.focus();box.select();toast("Selected. Press Ctrl/Cmd+C to copy");};
   try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),fallback);}catch(err){fallback();}}
 else if(t.id==="importBtn"){try{const d=JSON.parse($("#importBox").value);if(typeof d!=="object"||!d)throw 0;S=Object.assign(defaults(),d);save();toast("Restored");location.hash="#overview";route();}catch(err){toast("That text isn't a valid backup. Paste the full export.");}}
 else if(t.id==="resetBtn"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirm reset";$("#resetNote").textContent="This replaces everything with the example data. Click again to confirm.";return;}
   S=defaults();save();toast("Reset to examples");route();}
});
route();persistLocal();renderSync();
</script>
