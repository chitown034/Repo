    box.innerHTML = groups.map(function (g) {
      return '<section class="ax-dgroup"><h2>' + esc(g) + "<span>" + by[g].length + '</span></h2><div class="ax-dgrid">' + by[g].map(function (d) {
        return '<a class="ax-dcard" href="' + esc(d.href) + '" target="_blank" rel="noopener"><span class="ax-dicon" style="--ax-hue:' + hue(d.name) + '" aria-hidden="true">' + esc(initials(d.name)) +
          '</span><span class="ax-dtext"><span class="ax-dname">' + esc(d.name) + '</span><span class="ax-dsub">' + esc(d.sub) + '</span></span><span class="ax-dgo" aria-hidden="true">\u2197</span></a>';
      }).join("") + "</div></section>";
    }).join("") || '<p class="ax-dnone">No dashboard matches \u201c' + esc(q) + '\u201d.</p>';
  }

  function sync() {
    var id = current(), p = pages().filter(function (x) { return x.id === id; })[0];
    if (dashMode) { var nd = dashLinks().length; id = DASH; p = { id: DASH, label: "Dashboards" }; }
    if (!p) return;
    document.querySelectorAll("[data-ax]").forEach(function (b) { if (b.getAttribute("data-ax") === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    var inBar = TABBAR.some(function (t) { return t[0] === id; });
    var more = $("axMoreTab"); if (more) { if (!inBar) more.setAttribute("aria-current", "page"); else more.removeAttribute("aria-current"); }
    $("axTitle").textContent = p.label;
    $("axEyebrow").textContent = dashMode ? "Launch" : groupOf(id);
    var n = dashMode ? nd : count(id);
    $("axSub").textContent = dashMode ? n + " dashboards and tools, one tap away \u2014 each opens in its own tab" : n + " panel" + (n === 1 ? "" : "s") + " on this page";
    $("axBarTitle").textContent = p.label;
    try { document.title = p.label + " — Command Deck"; } catch (e) {}
    var qa = $("qaStart"); if (qa) qa.style.display = id === "daily" ? "" : "none";
    if (dashMode) { var tt = $("axDFilter"); renderDash(tt ? tt.value : ""); }
  }

  var lastFocus = null;
  function openSheet() {
    if (!isPhone()) return;
    lastFocus = document.activeElement;
    document.documentElement.classList.add("ax-sheet");
    $("axMoreTab").setAttribute("aria-expanded", "true");
    $("axSide").setAttribute("aria-modal", "true");
    var f = $("axSide").querySelector('[aria-current="page"]') || $("axSide").querySelector(".ax-item");
    setTimeout(function () { try { f && f.focus({ preventScroll: true }); } catch (e) {} }, 60);
  }
  function closeSheet(restore) {
    if (!document.documentElement.classList.contains("ax-sheet")) return;
    document.documentElement.classList.remove("ax-sheet");
    var m = $("axMoreTab"); if (m) m.setAttribute("aria-expanded", "false");
    $("axSide").removeAttribute("aria-modal");
    if (restore !== false && lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }

  function boot() {
    if (!$("pageTabs") || !tabs().length || $("axSide")) return;
    var root = document.documentElement;

    var side = document.createElement("aside");
    side.id = "axSide"; side.setAttribute("aria-label", "Command Deck navigation");
    side.innerHTML = '<div class="ax-side-head"><span class="ax-app">Command Deck</span><span class="ax-date" id="axDate"></span><button type="button" class="ax-done" id="axDone">Done</button></div>' +
      '<button type="button" class="ax-searchbtn" id="axSearch">' + icon("_search").replace('aria-hidden="true"', 'aria-hidden="true" width="15" height="15"') + "<span>Search</span><kbd>⌘K</kbd></button>" +
      '<div class="ax-scroll"><nav id="axNav" aria-label="Pages"></nav><div class="ax-hiddenmenu" id="axDash"></div>' +
      '<div class="ax-foot" id="axFoot"><div class="ax-status" id="axStatus"></div><details id="axClocks"><summary>World clocks</summary></details></div></div>';
    document.body.appendChild(side);
    var scrim = document.createElement("div"); scrim.id = "axScrim"; document.body.appendChild(scrim);

    var bar = document.createElement("nav");
    bar.id = "axTabs"; bar.setAttribute("aria-label", "Main pages");
    bar.innerHTML = TABBAR.map(function (t) { return '<button type="button" class="ax-tab" data-ax="' + t[0] + '">' + icon(t[0]) + "<span>" + t[1] + "</span></button>"; }).join("") +
      '<button type="button" class="ax-tab" id="axMoreTab" aria-haspopup="dialog" aria-expanded="false" aria-controls="axSide">' + icon("_more") + "<span>More</span></button>";
    document.body.appendChild(bar);

    var main = $("a11yMain");
    var hero = document.createElement("header");
    hero.id = "axHero";
    hero.innerHTML = '<div class="ax-eyebrow" id="axEyebrow"></div><h1 id="axTitle"></h1><p id="axSub"></p>';
    if (main) main.insertBefore(hero, main.firstChild);
    var inner = document.querySelector(".deck-head-inner");
    if (inner) { var bt = document.createElement("div"); bt.id = "axBarTitle"; bt.setAttribute("aria-hidden", "true"); inner.insertBefore(bt, inner.firstChild); }

    /* Move, never copy: the moved nodes keep their ids, so every existing script that updates them still does. */
    var foot = $("axFoot"), status = $("axStatus");
    var nw = document.querySelector(".deck-head .head-nw"); if (nw) foot.insertBefore(nw, status);
    ["pillSync", "pillChecklist", "pillShift", "headClock"].forEach(function (id) { var el = $(id); if (el) status.appendChild(el); });
    var wc = $("worldClockBar"); if (wc) $("axClocks").appendChild(wc);
    var dm = $("dashMenu"); if (dm) $("axDash").appendChild(dm);
    var dp = document.createElement("section");
    dp.id = "axDashPage"; dp.setAttribute("aria-label", "Dashboards");
    dp.innerHTML = '<label class="ax-dfilter">' + icon("_search") + '<input type="search" id="axDFilter" placeholder="Find a dashboard" aria-label="Find a dashboard" autocomplete="off"></label><div id="axDList"></div>';
    if (main) main.insertBefore(dp, hero.nextSibling);
    var ds = $("deckDateShort"); if (ds) $("axDate").textContent = ds.textContent;

    buildSide();
    root.classList.add("ax");
    try { if (localStorage.getItem("ax.dashMode") === "1") setDash(true); } catch (e) {}
    sync();
    $("axDFilter").addEventListener("input", function () { renderDash(this.value); });

    document.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("[data-ax]");
      if (b) { e.preventDefault(); go(b.getAttribute("data-ax")); return; }
      if (e.target.closest && e.target.closest("#axMoreTab")) { if (root.classList.contains("ax-sheet")) closeSheet(); else openSheet(); return; }
      if (e.target === scrim || (e.target.closest && e.target.closest("#axDone"))) { closeSheet(); return; }
      if (e.target.closest && e.target.closest("#axSearch")) { closeSheet(false); var s = $("panelSearchInput"); if (s) { s.focus(); try { s.select(); } catch (x) {} } }
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
    window.addEventListener("resize", function () { if (!isPhone()) closeSheet(false); });

    /* Keep the shell in step however the page changes: its own buttons, [ ] keys, number keys, search jumps, #panel links. */
    var mo = new MutationObserver(function () { if (dashMode) setDash(false); sync(); });
    document.addEventListener("click", function (e) {
      if (dashMode && e.target.closest && e.target.closest('.panel-search-result, a[href^="#panel-"], [data-qa-go], .notif-item')) { setDash(false); sync(); }
    }, true);
    tabs().forEach(function (t) { mo.observe(t, { attributes: true, attributeFilter: ["class"] }); });
    var ds2 = $("deckDateShort"); if (ds2) new MutationObserver(function () { $("axDate").textContent = ds2.textContent; }).observe(ds2, { childList: true, characterData: true, subtree: true });

    /* Large title collapses into the toolbar once it scrolls away, as on iOS. */
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (es) { es.forEach(function (en) { root.classList.toggle("ax-scrolled", !en.isIntersecting); }); }, { rootMargin: "-56px 0px 0px 0px" }).observe(hero);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
